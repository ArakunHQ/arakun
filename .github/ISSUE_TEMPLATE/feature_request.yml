name: Feature request
description: Suggest an idea or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like Arakun to do. Mockups or examples from other tools help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you use now, or other approaches you considered.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of Arakun this is about, if you know. It sets the issue's area label.
      multiple: true
      options:
        - App
        - Browser
        - Relay
        - Phone
        - Isometric
        - CI/release
  - type: dropdown
    id: platform
    attributes:
      label: Platforms it matters on
      multiple: true
      options:
        - Linux
        - Windows
        - macOS
        - All
