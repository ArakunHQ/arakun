name: Runner usage
description: >-
  Samples CPU and memory for the rest of the job and, when the job ends, reports
  the summary as a notice annotation titled "Runner usage". The weekly
  runner-sizing workflow reads these annotations back to tell whether each job's
  runner is the right size.
# Use it as `$/.github/actions/runner-usage`, which needs no checkout, early in
# the job: the summary covers everything from this step to the end of the job.
# Works on Linux (also inside a container job) and Windows.
runs:
  using: node24
  main: start.mjs
  post: stop.mjs
