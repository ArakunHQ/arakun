# Weekly update pull requests, one per ecosystem, so the actions, the cloud
# Worker's packages and the crates don't fall behind unnoticed.
#
# Titles carry a Conventional Commits prefix because conventional-commits.yml
# fails any pull request title without one, Dependabot's included.
#
# Each update waits a week after its release: a hijacked release is usually
# found and pulled within days, before it reaches a pull request here.
version: 2
updates:
  # The workflows, and the composite actions in .github/actions, which pin
  # actions of their own (gpui-libs).
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    commit-message: { prefix: ci }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /cloud
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    commit-message: { prefix: build(cloud) }
    groups:
      cloud: { patterns: ["*"] }

  # Major versions come as pull requests of their own, as they often need code
  # changes.
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    commit-message: { prefix: build }
    groups:
      crates:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # gpui and wgpu-hal come from pinned git revisions of forks ([patch] in
      # Cargo.toml), and cef has to match the CEF distribution
      # (tools/install-cef.sh). These move by hand.
      - dependency-name: "gpui*"
      - dependency-name: "wgpu*"
      - dependency-name: "naga"
      - dependency-name: "cef*"
