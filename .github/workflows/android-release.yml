name: Android release

# Builds the Android app (android/) as an App Bundle, signs it with the upload
# key and uploads it to Google Play. CI's Android job only builds the bundle
# unsigned; this is the delivery.
#
# Two ways in:
#
# - A release: release.yml calls this after its publish job, on the v* tag,
#   so only a tag that passed CI and was published uploads. Pre-releases (a
#   `-` in the tag) don't upload. The app's version is the tag's.
# - By hand, for a test build between releases, on main or a v* tag:
#
#     gh workflow run android-release.yml --ref main
#     gh workflow run android-release.yml --ref main -f track=beta -f status=draft
#
#   Off a tag, the version is Cargo.toml's.
#
# The version code is the minutes since 1970 (about 29 million now), so it
# always goes up, whichever way in, and stays under Play's 2,100,000,000 for
# thousands of years.
#
# It uses these secrets of the `release` environment, whose deployment rules
# already let main and v* tags through:
#
#   ANDROID_UPLOAD_KEYSTORE           the upload keystore (.jks), base64
#   ANDROID_UPLOAD_KEYSTORE_PASSWORD  its password
#   ANDROID_UPLOAD_KEY_ALIAS          the key's alias in it
#   ANDROID_UPLOAD_KEY_PASSWORD       the key's password
#   PLAY_SERVICE_ACCOUNT_JSON         a service account key (JSON) with release
#                                     rights on the app in Play Console
#
# Without the keystore the job says so and skips, so a release is never held up
# by it. Without the service account it still builds and signs, and leaves the
# bundle as an artifact of the run. Play takes an app's first bundle only by
# hand in Play Console (with Play App Signing on, which keeps the real signing
# key; the upload key only proves a bundle is ours): upload the artifact of a
# run there once, then the next ones go up by themselves. Until Play has
# reviewed the app, run with `-f status=draft`.

on:
  workflow_call:
    # A called workflow gets an environment secret only when the caller passes
    # it; otherwise it is empty.
    secrets:
      ANDROID_UPLOAD_KEYSTORE:
        required: false
      ANDROID_UPLOAD_KEYSTORE_PASSWORD:
        required: false
      ANDROID_UPLOAD_KEY_ALIAS:
        required: false
      ANDROID_UPLOAD_KEY_PASSWORD:
        required: false
      PLAY_SERVICE_ACCOUNT_JSON:
        required: false
  workflow_dispatch:
    inputs:
      track:
        description: "Google Play track"
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      status:
        description: "completed, or draft for an app Play has not reviewed yet"
        type: choice
        options: [completed, draft]
        default: completed

permissions: {}

jobs:
  play:
    name: Upload to Google Play
    if: >-
      (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-'))
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: release
      url: https://play.google.com/console
    # One upload at a time; never one cancelled half way.
    concurrency:
      group: android-release
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Check the upload key is set
        id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::notice::The release environment has no Android upload key yet; skipping"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$PLAY" ]; then echo "play=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.ready == 'true'
        with:
          persist-credentials: false

      - name: Version and version code
        id: version
        if: steps.key.outputs.ready == 'true'
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/tags/v*) version=${REF#refs/tags/v} ;;
            *) version=$(sed -n 's/^version = "\([0-9.]*\).*"/\1/p' Cargo.toml | head -n 1) ;;
          esac
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$version' is not a version"; exit 1; }
          code=$(( $(date -u +%s) / 60 ))
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "::notice::Arakun for Android $version ($code)"

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        if: steps.key.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: 17

      # compileSdk is 37.2, which the runner's SDK may not have yet.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        if: steps.key.outputs.ready == 'true'
        with:
          packages: platform-tools platforms;android-37.2 build-tools;37.0.0

      # A release build starts clean: no cache another run could have filled.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: steps.key.outputs.ready == 'true'
        with:
          cache-disabled: true

      - name: Write the upload key
        if: steps.key.outputs.ready == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"

      # Gradle reads ORG_GRADLE_PROJECT_<name> as the property <name>, so the
      # passwords stay off the command line.
      - name: Build and sign the bundle
        if: steps.key.outputs.ready == 'true'
        working-directory: android
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
          ORG_GRADLE_PROJECT_versionName: ${{ steps.version.outputs.version }}
          ORG_GRADLE_PROJECT_versionCode: ${{ steps.version.outputs.code }}
          ORG_GRADLE_PROJECT_uploadStoreFile: ${{ runner.temp }}/upload.jks
          ORG_GRADLE_PROJECT_uploadStorePassword: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_uploadKeyAlias: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_uploadKeyPassword: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          ./gradlew :app:bundleRelease
          aab=app/build/outputs/bundle/release/app-release.aab
          # A bundle Gradle left unsigned would only fail at Play.
          jarsigner -verify "$aab" | grep -q "jar verified" || { echo "::error::$aab is not signed"; exit 1; }
          mkdir -p "$RUNNER_TEMP/out"
          cp "$aab" "$RUNNER_TEMP/out/arakun-android-$VERSION-$CODE.aab"

      - name: Remove the upload key
        if: always() && steps.key.outputs.ready == 'true'
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.key.outputs.ready == 'true'
        with:
          name: arakun-android-${{ steps.version.outputs.version }}-${{ steps.version.outputs.code }}
          path: ${{ runner.temp }}/out/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload to Google Play
        if: steps.key.outputs.ready == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          TRACK: ${{ inputs.track || 'internal' }}
          STATUS: ${{ inputs.status || 'completed' }}
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::notice::The release environment has no Play service account yet; the signed bundle is the run's artifact"
            exit 0
          fi
          python3 -I android/tools/play-upload.py "$RUNNER_TEMP"/out/*.aab \
            --track "$TRACK" --status "$STATUS" --name "$VERSION ($CODE)"
