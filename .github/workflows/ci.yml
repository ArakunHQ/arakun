name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs these jobs next to its builds and publishes only when
  # they pass, so a tag on a commit that fails them never publishes.
  workflow_call:
    inputs:
      # release.yml sets it when this workflow already passed on main for the
      # same commit, with every Rust job run. Then every job skips: running them
      # again only waited for a macOS runner (66 of v0.6.0's 91 minutes).
      main-passed:
        type: boolean
        default: false

# github.workflow is the caller's name when release.yml calls this file, so
# that run and a pull request's own CI run don't cancel each other.
# A pull request's runs share a group, so a new push cancels the old run. Other
# runs (pushes to main, schedules) get a group per commit: they never cancel or
# replace each other, so every commit on main keeps its own result. GitHub
# keeps only one pending run per group, so turning off cancel-in-progress alone
# would still drop runs when several commits land at once.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

# The jobs only check out and build; none of them writes to the repository.
permissions:
  contents: read

# Cargo.toml optimizes every dependency in dev builds (opt-level 2), which pays
# off locally where they build once. In CI they build cold on every cache miss,
# so here dependencies stay unoptimized and nothing carries debug info.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CI_CARGO_CONFIG: profile.dev.package."*".opt-level=0

jobs:
  # Decides which of the jobs below a change needs, so a docs-only, relay-only
  # or teams-only change does not pay for the Rust builds. The jobs are still
  # required checks: a job skipped by its `if` counts as passed, while a
  # workflow-level `paths` filter would leave the checks pending forever.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
      relay: ${{ steps.diff.outputs.relay }}
      teams: ${{ steps.diff.outputs.teams }}
      android: ${{ steps.diff.outputs.android }}
    steps:
      - name: Sort the changed files
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          MAIN_PASSED: ${{ inputs.main-passed }}
        run: |
          if [ "$MAIN_PASSED" = true ]; then
            echo "::notice::CI already passed on main for $AFTER, so every job skips"
            { echo rust=false; echo relay=false; echo teams=false; echo android=false; } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          everything() {
            echo "::notice::$1, so every job runs"
            { echo rust=true; echo relay=true; echo teams=true; echo android=true; } >> "$GITHUB_OUTPUT"
            exit 0
          }

          # release.yml calls this file for a tag, whose checks gate the release.
          # A rename counts at both paths: moving a file out of src/ changes the build.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            everything "A tag"
          elif [ "$EVENT" = pull_request ]; then
            files=$(gh api --paginate "repos/$GH_REPO/pulls/$PR/files" \
              --jq '.[] | .filename, (.previous_filename // empty)') || everything "Could not list the changed files"
            limit=3000
          elif [ -z "$BEFORE" ] || [[ "$BEFORE" =~ ^0+$ ]]; then
            everything "No previous commit to compare with"
          else
            files=$(gh api "repos/$GH_REPO/compare/$BEFORE...$AFTER" \
              --jq '.files[] | .filename, (.previous_filename // empty)') || everything "Could not list the changed files"
            limit=300
          fi
          # The API stops listing at the limit, so the list may be incomplete.
          [ "$(grep -c . <<< "$files")" -lt "$limit" ] || everything "Too many changed files to list"

          rust=false
          relay=false
          teams=false
          android=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              # How CI itself runs: test everything with it.
              .github/workflows/ci.yml | .github/actions/*) rust=true relay=true teams=true android=true ;;
              # The relay job also runs the phone tests.
              relay/*) relay=true ;;
              teams/*) teams=true ;;
              # The app embeds phone/ (rust_embed) and tests against its vectors,
              # as the Android app's protocol tests do.
              phone/*) rust=true relay=true android=true ;;
              # The Android app alone: nothing the Rust build reads.
              android/*) android=true ;;
              # The Android app takes the mascot's drawing and the fonts from assets/.
              assets/brand/mascot.json | assets/fonts/*) rust=true android=true ;;
              # The browser job prepares CEF with it.
              tools/install-cef.sh) rust=true ;;
              # The Clippy job runs it to check the formatting.
              tools/rustfmt.sh) rust=true ;;
              # The Server job runs it on the binary it builds.
              tools/check-server-libs.sh) rust=true ;;
              # A test in src/design_lint.rs checks the layout audit against its fixtures.
              tools/layout_audit.py | tools/layout-audit-fixtures/*) rust=true ;;
              # Nothing the Rust build or its tests read. Anything not listed
              # here, such as a new top-level folder, runs the Rust jobs.
              docs/* | iso/* | tools/* | .claude/* | .github/* | LICENSE | NOTICE | .gitignore | deny.toml) ;;
              */*) rust=true ;;
              *.md) ;;
              *) rust=true ;;
            esac
          done <<< "$files"

          echo "rust=$rust relay=$relay teams=$teams android=$android"
          { echo "rust=$rust"; echo "relay=$relay"; echo "teams=$teams"; echo "android=$android"; } >> "$GITHUB_OUTPUT"

  # Clippy and the tests build different artifacts (metadata vs. code), so they
  # run side by side instead of one after the other.
  #
  # The three Linux Rust jobs run on 4 CPUs. With a warm cache, 8 CPUs were only
  # 21-29% busy, and halving them cost 3-8% more time (runner sizing, #98).
  # Not 2: the report estimated Clippy 8-12% slower there, but a cached cargo
  # clippy took 32-35 s instead of 18-23 s, which saves almost no CPU-minutes
  # (#137).
  clippy:
    name: Clippy (no warnings)
    needs: changes
    # Runs unless `changes` said no: if it failed, its outputs are empty and
    # the job runs, because a skipped required check would count as passed.
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: depot-ubuntu-24.04-4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # CPU and memory use for the weekly runner-sizing report.
      - uses: $/.github/actions/runner-usage

      - uses: $/.github/actions/gpui-libs

      # The version and components in rust-toolchain.toml. Runner images ship rustup.
      - name: Rust toolchain
        run: rustup toolchain install --no-self-update

      # Takes seconds and builds nothing. The script stands in for the private
      # modules that rustfmt would otherwise stop at.
      - name: cargo fmt
        run: tools/rustfmt.sh --check

      # Only main saves; pull requests restore main's entry. Depot Cache does not
      # keep branches apart, so a pull request's save would reach main's builds.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Without the `browser` feature the CEF SDK is not needed. Includes design_lint.
      - name: cargo clippy
        run: cargo clippy --locked --all-targets --no-default-features --config "$CI_CARGO_CONFIG" -- -D warnings

  # The default `browser` feature needs CEF, so the other jobs leave it out. This one
  # prepares CEF as the README does on Linux, so core/src/browser/ and arakun-helper compile.
  clippy-browser:
    name: Clippy (Linux, browser)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: depot-ubuntu-24.04-4
    env:
      # The version the `cef` crate in Cargo.lock is built for. The minimal archive has
      # all that tools/install-cef.sh takes. The SHA-1 is the one cef-builds publishes.
      CEF_ARCHIVE: cef_binary_156.0.15+gcf671c0+chromium-156.0.8078.80_linux64_minimal.tar.bz2
      CEF_SHA1: 09235427222e026a4f34399742df27c5d98a4f8a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # CPU and memory use for the weekly runner-sizing report.
      - uses: $/.github/actions/runner-usage

      - uses: $/.github/actions/gpui-libs

      # Clippy needs only the build-time SDK that tools/install-cef.sh makes
      # (headers and a stub libcef.so, a few MB). Unpacking the 330 MB archive
      # for it took 27-36 s a run. Like the Rust cache, only main saves it: any
      # branch could save an entry under this key, and a cache hit skips the
      # SHA-1 check below.
      - name: Restore the CEF SDK
        id: cef-sdk
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cef/sdk
          key: cef-sdk-${{ env.CEF_ARCHIVE }}-${{ hashFiles('tools/install-cef.sh') }}

      # 330 MB that never changes for a given version.
      - name: Cache the CEF archive
        if: steps.cef-sdk.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cef-archive
          key: ${{ env.CEF_ARCHIVE }}

      - name: Prepare CEF
        if: steps.cef-sdk.outputs.cache-hit != 'true'
        run: |
          archive="$RUNNER_TEMP/cef-archive/$CEF_ARCHIVE"
          if [ ! -f "$archive" ]; then
            mkdir -p "$RUNNER_TEMP/cef-archive"
            curl -fsSL --retry 3 -o "$archive" "https://cef-builds.spotifycdn.com/${CEF_ARCHIVE//+/%2B}"
          fi
          # On a cache hit too: any branch can save this cache entry.
          echo "$CEF_SHA1  $archive" | sha1sum -c -
          mkdir -p "$RUNNER_TEMP/cef-dist"
          tar -xjf "$archive" -C "$RUNNER_TEMP/cef-dist" --strip-components=1
          tools/install-cef.sh "$RUNNER_TEMP/cef-dist" "$RUNNER_TEMP/cef"

      - name: Save the CEF SDK
        if: steps.cef-sdk.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cef/sdk
          key: ${{ steps.cef-sdk.outputs.cache-primary-key }}

      # install-cef.sh makes this link, but not on a cache hit. CEF_PATH in
      # .cargo/config.toml points at it.
      - name: Link the CEF SDK
        run: ln -sfn "$RUNNER_TEMP/cef/sdk" .cef-sdk

      # The version and components in rust-toolchain.toml. Runner images ship rustup.
      - name: Rust toolchain
        run: rustup toolchain install --no-self-update

      # Only main saves; pull requests restore main's entry. Depot Cache does not
      # keep branches apart, so a pull request's save would reach main's builds.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: clippy-browser
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo clippy
        run: cargo clippy --locked --all-targets --config "$CI_CARGO_CONFIG" -- -D warnings

  test:
    name: Tests (Linux, no browser)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: depot-ubuntu-24.04-4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # CPU and memory use for the weekly runner-sizing report.
      - uses: $/.github/actions/runner-usage

      - uses: $/.github/actions/gpui-libs

      # The version and components in rust-toolchain.toml. Runner images ship rustup.
      - name: Rust toolchain
        run: rustup toolchain install --no-self-update

      # Only main saves; pull requests restore main's entry. Depot Cache does not
      # keep branches apart, so a pull request's save would reach main's builds.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo test
        run: cargo test --locked --no-default-features --config "$CI_CARGO_CONFIG"

  # arakun-server (server/) is the app's server for a machine with no display:
  # the same code (core/), against GPUI without Wayland and X11. It is a package
  # of its own, which the jobs above leave out, and it is only worth having if it
  # really needs no desktop library. So this job installs none of them, builds it
  # alone, as someone setting up a server would, and reads what the binary needs.
  # Built together with the app it would get the app's GPUI, display code and all.
  # 2 CPUs, not the other Linux Rust jobs' 4: on 4 they were 29% busy and never
  # 90%+, and it finishes well before Clippy (Windows) anyway (runner sizing,
  # #428).
  server:
    name: Server (Linux, no display libraries)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # CPU and memory use for the weekly runner-sizing report.
      - uses: $/.github/actions/runner-usage

      # The version and components in rust-toolchain.toml. Runner images ship rustup.
      - name: Rust toolchain
        run: rustup toolchain install --no-self-update

      # Only main saves; pull requests restore main's entry. Depot Cache does not
      # keep branches apart, so a pull request's save would reach main's builds.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: server
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Its own main.rs and the stand-ins in it; the modules it shares with the
      # app are linted there, tests included.
      - name: cargo clippy
        run: cargo clippy --locked -p arakun-server --config "$CI_CARGO_CONFIG" -- -D warnings

      - name: cargo build
        run: cargo build --locked -p arakun-server --config "$CI_CARGO_CONFIG"

      - name: Starts without a display
        run: target/debug/arakun-server --version

      - name: Needs no desktop library
        run: tools/check-server-libs.sh target/debug/arakun-server

  # The cfg(windows) code and the Windows-only crates (windows, windows-sys,
  # uds_windows) compile nowhere else, so without this job a Windows break
  # first showed up while building a release. Clippy only, no tests: it compiles
  # the tests too, and running them on Windows is a separate step. 4 CPUs, not
  # the release build's 8: with a warm cache 8 were 22% busy, and 4 cost about
  # 2% more time (runner sizing, #132).
  clippy-windows:
    name: Clippy (Windows)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: depot-windows-2025-4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # CPU and memory use for the weekly runner-sizing report.
      - uses: $/.github/actions/runner-usage

      # The version and components in rust-toolchain.toml. Runner images ship rustup.
      - name: Rust toolchain
        run: rustup toolchain install --no-self-update

      # Only main saves; pull requests restore main's entry. Depot Cache does not
      # keep branches apart, so a pull request's save would reach main's builds.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: clippy-windows
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # bash (Git for Windows), so "$CI_CARGO_CONFIG" expands as on the other jobs.
      - name: cargo clippy
        shell: bash
        run: cargo clippy --locked --all-targets --no-default-features --config "$CI_CARGO_CONFIG" -- -D warnings

  # macOS builds other code (cfg(target_os = "macos"), no /proc, BSD tools), so
  # Linux passing says little about it. No runner-usage step: it supports only
  # Linux and Windows, and Depot's macOS runners come in one size (8 CPUs).
  #
  # Clippy and the tests share one job because Depot has few macOS machines. On
  # 18 Nov 2026 the macOS jobs waited a median of 4 and up to 100 minutes for
  # one, while each ran in 1-3 minutes; one job asks for half as many machines.
  #
  # On GitHub's runners for now: on 19 Nov 2026 Depot's macOS runners took no
  # job for hours and held up a release. Free here, as the repository is public.
  macos:
    name: Clippy and tests (macOS, no browser)
    needs: changes
    permissions:
      contents: read
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: macos-latest
    # Several merges in a row queued a macOS job for every commit on main. Here
    # one runs and only the newest waits; GitHub cancels the older waiting ones.
    # The newest tests what they changed too, and saves the cache. Every other
    # run gets a group per run, so it never cancels or is cancelled here: pull
    # requests, tags, and release.yml's nightlies, which run on main but by
    # schedule or by hand and fail if this job is cancelled.
    concurrency:
      group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'ci-macos-main' || format('ci-macos-{0}', github.run_id) }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version and components in rust-toolchain.toml. Runner images ship rustup.
      - name: Rust toolchain
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: macos
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo clippy
        run: cargo clippy --locked --all-targets --no-default-features --config "$CI_CARGO_CONFIG" -- -D warnings

      # Also after a Clippy warning, so one push shows both results.
      - name: cargo test
        if: ${{ !cancelled() }}
        run: cargo test --locked --no-default-features --config "$CI_CARGO_CONFIG"

  # The phone relay (Cloudflare Worker) is TypeScript apart from the app; its
  # tests run the real Worker inside workerd, no account needed.
  relay:
    name: Relay (types and tests)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.relay != 'false' }}
    runs-on: depot-ubuntu-24.04
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # CPU and memory use for the weekly runner-sizing report.
      - uses: $/.github/actions/runner-usage

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: relay/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run

      # The phone's encryption against the vectors the Rust side wrote.
      - name: phone e2e vectors
        working-directory: phone
        run: node --test "test/*.test.mjs"

  # The teams Worker (sign-in and feature flags) is TypeScript apart from the
  # app, like the relay; its tests run the real Worker and D1 inside workerd.
  teams:
    name: Teams (types and tests)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.teams != 'false' }}
    runs-on: depot-ubuntu-24.04
    defaults:
      run:
        working-directory: teams
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # CPU and memory use for the weekly runner-sizing report.
      - uses: $/.github/actions/runner-usage

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: teams/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run

  # The Android app (android/): the protocol's tests, which check the Kotlin
  # crypto against phone/test/vectors and play a relay over a real socket, then
  # the app's lint and a debug build. Not a required check: it runs only when
  # those files change, and tools/wait-checks.sh waits for it then.
  android:
    name: Android (Kotlin tests, lint and build)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.android != 'false' }}
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # CPU and memory use for the weekly runner-sizing report.
      - uses: $/.github/actions/runner-usage

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17

      # compileSdk is 37.2, which the runner's SDK may not have yet.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-37.2 build-tools;37.0.0

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - run: ./gradlew :kit:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      # The release bundle, unsigned, as android-release.yml builds it signed:
      # a change that breaks R8 or the bundle fails here, not at a release.
      - name: Release bundle
        run: ./gradlew :app:bundleRelease
