name: Cloud deploy

# Deploys the hosted cloud Worker (cloud/: the relay and the teams API), the
# phone page it serves (phone/) and the admin Worker (cloud/admin/: the operator
# panel at admin.arakun.dev) to arakun.dev. It ships with the app's
# versions: release.yml calls this workflow after it publishes a release, so
# the Worker that runs is the one from the latest release, and a change merged
# on main waits for the next version, unless someone deploys main by hand.
#
# Four ways in:
#
# - A release: release.yml calls this after its publish job, on the v* tag.
#   Pre-releases (a `-` in the tag) don't deploy: most installs still run the
#   last release.
# - A redeploy of the latest release (to undo a hotfix): run this workflow by
#   hand on its tag.
#
#     gh workflow run cloud-deploy.yml --ref v1.2.3
#
# - A hotfix, without a new version: merge the fix on main as usual, then
#   cherry-pick it onto a `cloud-hotfix/<tag>` branch made from the latest
#   release's tag, push it and run this workflow on it.
#
#     git switch -c cloud-hotfix/v1.2.3 v1.2.3
#     git cherry-pick <the fix's commit on main>
#     git push origin cloud-hotfix/v1.2.3
#     gh workflow run cloud-deploy.yml --ref cloud-hotfix/v1.2.3
#
#   The branch may only change cloud/ and phone/, so what runs is the release
#   plus the fix; the admin Worker is under cloud/, so a hotfix can change it too.
#   A second hotfix for the same release goes on the same branch.
#   A commit that is not on main gets a warning: the next release deploys
#   main, and a fix only on the hotfix branch would go away again.
#
# - What is on main, without a new version: run this workflow by hand on main.
#
#     gh workflow run cloud-deploy.yml --ref main
#
#   main must contain the latest release's tag, which it does unless a release
#   was tagged off main. The next release deploys again from its tag, and a
#   redeploy of the latest release's tag or a hotfix branch made from it goes
#   back to the release without main's later changes.
#
# A manual run on any other ref fails and names the refs to use.
#
# Whatever the way in, only the latest published release, a hotfix branch made
# from it, or main (which contains it) deploys. So re-running an old release's
# run can't put an old Worker back.
#
# The `production` environment holds CLOUDFLARE_API_TOKEN, a token for the
# CoderLabs account that can edit Workers scripts and routes, read KV and edit D1 (it needs D1 edit
# permission because the deploy applies the migrations); it can
# also require a reviewer before a deploy. Its deployment rules must let v*
# tags, cloud-hotfix/* branches and main through. The settings live in
# cloud/wrangler.toml under [env.production] (the admin Worker's, in
# cloud/admin/wrangler.toml). The deploy's message names the tag, the hotfix
# branch and its commit, or main's commit. The admin Worker deploys with the
# rest. Its client ID for arakun.dev is committed, and a person sets its four
# secrets (see "The admin panel" in cloud/README.md). A copy of the repository
# keeps PLACEHOLDER until it has an OAuth App of its own; the step then says so
# and is skipped.

on:
  workflow_call:
    # A called workflow gets an environment secret only when the caller passes
    # it; otherwise it is empty and wrangler fails to log in.
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
  workflow_dispatch:

permissions: {}

jobs:
  # A manual run on another branch would skip the deploy below and show no
  # reason. Fail instead, and say which ref to run it on.
  wrong-ref:
    name: Check the ref
    if: >-
      github.event_name == 'workflow_dispatch'
      && !(startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-'))
      && !startsWith(github.ref, 'refs/heads/cloud-hotfix/v')
      && github.ref != 'refs/heads/main'
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          latest=$(gh release view --json tagName --jq .tagName || echo 'v<latest>')
          echo "::error::$REF does not deploy. Run this on main to ship what is on main (gh workflow run cloud-deploy.yml --ref main), on the latest release's tag (--ref $latest), or on a cloud-hotfix/$latest branch."
          exit 1

  deploy:
    name: Deploy the cloud Worker and the admin Worker
    # Pre-releases don't deploy; a branch other than a hotfix one or main never
    # does, and main only by hand. The step below checks the rest exactly.
    if: >-
      (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-'))
      || startsWith(github.ref, 'refs/heads/cloud-hotfix/v')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: depot-ubuntu-24.04
    environment:
      name: production
      url: https://arakun.dev
    # One deploy at a time, never one cancelled half way. Not per ref: a hotfix
    # and a release must not deploy at the same time. `queue: max` keeps every
    # waiting run: by default a new one cancels the one pending, so a manual
    # run could drop a release's deploy.
    concurrency:
      group: cloud-deploy
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The release's tags and main, to compare a hotfix branch or main with.
          fetch-depth: 0

      # Production has no database until a person creates it (see "First
      # production deploy" in cloud/README.md). Fail now, before an install or
      # a deploy, instead of in the migrations step.
      - name: Check production has a database
        working-directory: .
        run: |
          file=cloud/wrangler.toml
          # The database_id of the [[env.production.d1_databases]] block, with
          # either quote style and any spacing. Empty if anything is missing.
          id=$(awk '
            /^[[:space:]]*\[/ { inblock = ($0 ~ /^[[:space:]]*\[\[env\.production\.d1_databases\]\][[:space:]]*(#.*)?$/) }
            inblock && /^[[:space:]]*database_id[[:space:]]*=/ {
              v = $0
              sub(/^[^=]*=[[:space:]]*/, "", v)
              sub(/[[:space:]]*(#.*)?$/, "", v)
              gsub(/^["\x27]|["\x27]$/, "", v)
              print v
              exit
            }' "$file") || id=
          if [ -z "$id" ]; then
            echo "::error file=$file::No database_id found under [[env.production.d1_databases]]. Create the database and set its id: see \"First production deploy\" in cloud/README.md"
            exit 1
          fi
          if [ "$id" = 00000000-0000-0000-0000-000000000000 ]; then
            echo "::error file=$file::The production D1 database_id is still the placeholder $id. Create the database and set its id first: see \"First production deploy\" in cloud/README.md"
            exit 1
          fi

      # The `if` above compares without case and only by prefix. This compares
      # exactly, and finds the release the ref belongs to.
      - name: Check the ref is the latest release
        id: ref
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          # GitHub's latest release: published, not a draft or pre-release.
          latest=$(gh release view --json tagName --jq .tagName)

          case "$REF" in
            refs/tags/v*) tag=${REF#refs/tags/} kind=release ;;
            refs/heads/cloud-hotfix/v*) tag=${REF#refs/heads/cloud-hotfix/} kind=hotfix ;;
            refs/heads/main) tag=$latest kind=main ;;
            *) echo "::error::$REF is neither a v* tag, a cloud-hotfix/v* branch nor main"; exit 1 ;;
          esac
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$tag is not a release version"; exit 1; }

          if [ "$kind" = main ]; then
            # Main is ahead of every release tagged from it; one tagged off main
            # would be undone by this deploy.
            git merge-base --is-ancestor "$latest" HEAD || {
              echo "::error::main does not contain the latest release $latest; deploying it would drop that release's changes"
              exit 1
            }
            message="main $(git rev-parse --short HEAD) (after $latest)"
            echo "message=$message" >> "$GITHUB_OUTPUT"
            echo "::notice::deploying: $message"
            exit 0
          fi

          if [ "$tag" != "$latest" ]; then
            echo "::error::$tag is not the latest release ($latest); only the latest release's Worker deploys"
            exit 1
          fi

          if [ "$kind" = hotfix ]; then
            git merge-base --is-ancestor "$tag" HEAD || {
              echo "::error::$REF is not made from $tag"; exit 1
            }
            other=$(git diff --name-only "$tag" HEAD | grep -Ev '^(cloud|phone)/' || true)
            if [ -n "$other" ]; then
              printf '%s\n' "$other"
              echo "::error::a cloud hotfix may only change cloud/ and phone/; the files above differ from $tag"
              exit 1
            fi
            # `git cherry` matches by patch, so a cherry-pick of main's commit counts.
            missing=$(git cherry origin/main HEAD "$tag" | sed -n 's/^+ //p')
            for c in $missing; do
              echo "::warning::$(git log -1 --format='%h %s' "$c") is not on main; the next release would deploy without it"
            done
            message="hotfix $tag $(git rev-parse --short HEAD)"
          else
            message="release $tag"
          fi
          echo "message=$message" >> "$GITHUB_OUTPUT"
          echo "::notice::deploying: $message"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            cloud/package-lock.json
            cloud/admin/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run

      - name: phone e2e vectors
        working-directory: phone
        run: node --test "test/*.test.mjs"

      # The tables the new code reads, before it runs. Applied migrations are
      # skipped, so this is safe on every deploy. Migrations only add: the
      # Worker that is still running keeps working until the deploy below.
      - name: Apply the D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 0156eeaadfaba2bf822554cefa9ea5d8
        run: npx wrangler d1 migrations apply DB --env production --remote

      # wrangler from package-lock.json, so the version is the one tested.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 0156eeaadfaba2bf822554cefa9ea5d8
          MESSAGE: ${{ steps.ref.outputs.message }}
        run: npx wrangler deploy --env production --message "$MESSAGE"

      # The admin Worker's sign-in needs a GitHub OAuth App. arakun.dev's ID is
      # committed; a copy of the repository creates its own (see "The admin
      # panel" in cloud/README.md). While the client ID is PLACEHOLDER, skip the
      # deploy instead of shipping a Worker that nobody can sign in to. A
      # missing value is a broken file: fail.
      - name: Check the admin Worker is set up
        id: admin
        working-directory: .
        run: |
          file=cloud/admin/wrangler.toml
          # GITHUB_CLIENT_ID of the [env.production.vars] block, with either
          # quote style and any spacing. Empty if anything is missing.
          id=$(awk '
            /^[[:space:]]*\[/ { inblock = ($0 ~ /^[[:space:]]*\[env\.production\.vars\][[:space:]]*(#.*)?$/) }
            inblock && /^[[:space:]]*GITHUB_CLIENT_ID[[:space:]]*=/ {
              v = $0
              sub(/^[^=]*=[[:space:]]*/, "", v)
              sub(/[[:space:]]*(#.*)?$/, "", v)
              gsub(/^["\x27]|["\x27]$/, "", v)
              print v
              exit
            }' "$file") || id=
          if [ -z "$id" ]; then
            echo "::error file=$file::No GITHUB_CLIENT_ID found under [env.production.vars]. See \"The admin panel\" in cloud/README.md"
            exit 1
          fi
          if [ "$id" = PLACEHOLDER ]; then
            echo "::notice file=$file::The admin Worker is not set up (GITHUB_CLIENT_ID is still PLACEHOLDER), so it is not deployed. See \"The admin panel\" in cloud/README.md"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # After the cloud Worker, so the /admin/* routes it proxies to are there
      # first. The admin Worker has its own dependencies and page build.
      # If one of these steps fails, the run is red with the cloud Worker
      # already live and the admin Worker old or absent. Re-run the same tag:
      # every step is safe to repeat and deploys both again.
      - name: Install the admin Worker
        if: steps.admin.outputs.ready == 'true'
        working-directory: cloud/admin
        run: npm ci

      # The Cloudflare Vite plugin picks the wrangler environment when it
      # builds, not when wrangler deploys. Without CLOUDFLARE_ENV the build is
      # the dev Worker (arakun-admin-dev, no route, the dev service binding)
      # and `wrangler deploy --env production` would publish that.
      - name: Build the admin panel
        if: steps.admin.outputs.ready == 'true'
        working-directory: cloud/admin
        env:
          CLOUDFLARE_ENV: production
        run: npm run build

      - name: Check the build is production's
        if: steps.admin.outputs.ready == 'true'
        working-directory: cloud/admin
        run: |
          name=$(node -e 'const c = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); console.log(c.name)' "$(node -e 'const d = JSON.parse(require("fs").readFileSync(".wrangler/deploy/config.json", "utf8")); console.log(require("path").resolve(".wrangler/deploy", d.configPath))')")
          if [ "$name" != arakun-admin ]; then
            echo "::error::The admin build is for the Worker \"$name\", not arakun-admin. Build it with CLOUDFLARE_ENV=production."
            exit 1
          fi

      - name: Deploy the admin Worker
        if: steps.admin.outputs.ready == 'true'
        working-directory: cloud/admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 0156eeaadfaba2bf822554cefa9ea5d8
          MESSAGE: ${{ steps.ref.outputs.message }}
        run: npx wrangler deploy --env production --message "$MESSAGE"
