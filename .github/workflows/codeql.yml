name: CodeQL

# Static analysis for security problems. Alerts show in the repository's
# Security tab. It runs on main and on a schedule, not on pull requests.
# CodeQL is not a required check, so a run on every push only queued runners
# ahead of the checks people wait for.
#
# Every language uses build-mode none: CodeQL reads the sources without
# building them, so the Rust job needs neither the GPUI system libraries nor
# a cargo build, and the TypeScript job needs no npm ci.
#
# This is the "advanced setup". GitHub's "default setup" (Settings > Code
# security) must stay off: with both on, uploads from this workflow are
# rejected.

on:
  push:
    branches: [main]
  # New queries ship with CodeQL releases, so main is checked weekly even when
  # nothing changes.
  schedule:
    - cron: "23 5 * * 2"
  # To scan a branch by hand: Actions > CodeQL > Run workflow.
  workflow_dispatch:

permissions: {}

# Each run gets a group per commit: runs never cancel or replace each other, so
# every commit on main keeps its own result. GitHub keeps only one pending run
# per group, so turning off cancel-in-progress alone would still drop runs when
# several commits land at once.
concurrency:
  group: codeql-${{ github.sha }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      security-events: write # upload the results
    strategy:
      fail-fast: false
      matrix:
        include:
          # The app, its examples and build.rs.
          - language: rust
            runner: depot-ubuntu-24.04-8
          # relay/ (Cloudflare Worker) and phone/ (the web app).
          - language: javascript-typescript
            runner: depot-ubuntu-24.04
          # The scripts in tools/.
          - language: python
            runner: depot-ubuntu-24.04
          # The workflows in .github/, for injection and permission problems.
          - language: actions
            runner: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # CPU and memory use for the weekly runner-sizing report.
      - uses: $/.github/actions/runner-usage

      # Pinned: this job can write security results.
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
