name: Human approval

# Sets the "Human approval" commit status, which the main ruleset requires.
# It stays pending on a pull request from outside the team until someone on
# the team approves its head commit, and passes at once for the team. The
# Reviewers workflow dismisses CodeRabbit's approval of such a pull request,
# but only after the approval, so it can't stop a merge in between; this
# status does.
#
# It is its own workflow, not a job in Reviewers, because a pull_request_target
# run shows on the pull request: a skipped "Request reviewers" job there looks
# like a check that didn't run.
#
# When it runs:
# - pull_request_target: a new head commit needs its status. The old head, or
#   the head of a closed pull request, may be shared with another open pull
#   request, so its status is worked out again.
# - workflow_run: the "Review submitted" workflow ran, so a review was
#   submitted or dismissed and the status may change.
# - workflow_dispatch: by hand, for a pull request whose status is missing.
#
# These events run this file from the default branch with a write token, even
# for pull requests from forks. That is safe only because no job checks out or
# runs code from the pull request: the reviews come from the API. Keep it that
# way. A change to this file takes effect once it is on main.

on:
  # Safe as the comment above says; zizmor can't see that no job checks out.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, reopened, synchronize, closed]
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Review submitted]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true

permissions: {}

env:
  # The members of the ArakunHQ/maintainers team. The workflow's token can't
  # read team membership, so keep this in step by hand, here and in
  # reviewers.yml.
  TEAM: KarloAldrete rikvisser-dev daniektj

jobs:
  approval:
    name: Human approval status
    # No concurrency group: a cancelled or replaced run would skip the heads
    # it was given, such as the old head after two quick pushes. Instead
    # every run reads the reviews again after it writes (see update), so
    # overlapping runs end on the latest verdict.
    runs-on: depot-ubuntu-24.04
    # Each head gets its own deadline (see HEAD_BUDGET), so a slow head
    # leaves time for the next. The default six hours is far too long for a
    # hung run.
    timeout-minutes: 30
    permissions:
      pull-requests: read
      statuses: write
    steps:
      - name: Set the Human approval status
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          # The commits whose status may change: on workflow_run, the head of
          # the pull request that was reviewed; on pull_request_target, the
          # head and, after a push, the head before it.
          SHAS: >-
            ${{ github.event.workflow_run.head_sha }}
            ${{ github.event.pull_request.head.sha }}
            ${{ github.event.before }}
          PR: ${{ inputs.pr }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # Seconds each head may use, checked before every call and wait.
          # A call already running can go a minute or two past it, so two
          # heads stay inside the job's 30 minutes.
          HEAD_BUDGET=600
          deadline=0
          past_deadline() { [ "$SECONDS" -ge "$deadline" ]; }

          # Retries a call that failed on the network or on GitHub's side
          # (a timeout, HTTP 5xx or a rate limit), or took over a minute; any
          # other error fails at once. The output is held until the call succeeds, so a retried
          # --paginate doesn't print a page twice. Every call here can be
          # repeated safely. Keep in step with reviewers.yml.
          gh() {
            local attempt out err rc
            err=$(mktemp)
            for attempt in 1 2 3 4; do
              # timeout runs the gh program, not this function. A call that
              # hangs would otherwise use up the job's whole time limit.
              out=$(timeout 60 gh "$@" 2>"$err") && rc=0 || rc=$?
              if [ "$rc" = 0 ]; then
                rm -f "$err"
                [ -z "$out" ] || printf '%s\n' "$out"
                return 0
              fi
              cat "$err" >&2
              [ "$rc" != 124 ] || echo "gh took more than 60 seconds." >&2
              if [ "$attempt" = 4 ] || past_deadline || { [ "$rc" != 124 ] &&
                ! grep -qiE 'HTTP (5[0-9]{2}|429)|timeout|timed out|connection reset|unexpected EOF|TLS handshake|secondary rate limit|API rate limit exceeded' "$err"; }; then
                rm -f "$err"
                return 1
              fi
              echo "Retrying in $((attempt * 10)) seconds." >&2
              sleep $((attempt * 10))
            done
          }

          in_team() { grep -qxF "$1" <<<"${TEAM// /$'\n'}"; }

          # A status belongs to a commit, not a pull request, so it must hold
          # for every open pull request with this head. Prints the state and
          # the description, or nothing when no open pull request has it.
          # Runs where `set -e` does nothing, so every call that can fail
          # returns at once.
          verdict() {
            export HEAD=$1
            # The workflow_run event lists no pull request when the branch is
            # on a fork, so find them by their head commit.
            local prs
            prs=$(gh api "repos/$GH_REPO/pulls?state=open&per_page=100" --paginate \
              --jq '.[] | select(.head.sha == env.HEAD) | "\(.number) \(.user.login)"') || return 1
            [ -n "$prs" ] || return 0

            local state=success description="" pr author approvers approver user
            while read -r pr author; do
              if in_team "$author"; then
                echo "#$pr: the author is on the team." >&2
                continue
              fi
              # Each reviewer's last verdict on the head commit. A dismissed
              # review counts as the last verdict, so it clears an earlier
              # approval from the same person.
              approvers=$(gh api "repos/$GH_REPO/pulls/$pr/reviews" --paginate --jq \
                '.[] | select(.commit_id == env.HEAD and (.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED")) | "\(.user.login) \(.state)"' |
                awk '{ last[$1] = $2 } END { for (user in last) if (last[user] == "APPROVED") print user }') ||
                return 1
              approver=""
              for user in $approvers; do
                if in_team "$user"; then
                  approver=$user
                  break
                fi
              done
              if [ -n "$approver" ]; then
                echo "#$pr: approved by $approver." >&2
                description=${description:-"Approved by $approver."}
              else
                echo "#$pr: waiting for a maintainer." >&2
                state=pending
              fi
            done <<<"$prs"

            if [ "$state" = pending ]; then
              description="Waiting for a maintainer to approve: the author is outside the team."
            fi
            printf '%s\t%s\n' "$state" "${description:-"Not needed: the author is on the team."}"
          }

          # Writes the status, then reads the reviews again and writes again
          # until the verdict holds. Runs overlap (see the job's comment), and
          # one may read the reviews, then write after another run wrote a
          # newer verdict. Whichever run writes last reads again after its
          # write, so it puts back the verdict of the latest reviews. Fails
          # when the verdict doesn't hold, because its last write was never
          # read back; the caller then writes pending (fail_closed).
          update() {
            local current written="" state description _
            for _ in 1 2 3 4; do
              past_deadline && return 1
              current=$(verdict "$1") || return 1
              if [ -z "$current" ]; then
                echo "No open pull request has $1 as its head."
                return 0
              fi
              if [ "$current" = "$written" ]; then
                return 0
              fi
              IFS=$'\t' read -r state description <<<"$current"
              # Not through the retrying gh: a retry would write a verdict
              # read before its wait. The caller runs update again instead.
              timeout 60 gh api -X POST "repos/$GH_REPO/statuses/$1" --silent -f state="$state" \
                -f context="Human approval" -f description="$description" -f target_url="$RUN_URL" ||
                return 1
              echo "$1: $state, $description"
              written=$current
            done
            echo "::warning::The reviews of $1 kept changing."
            return 1
          }

          # Used when a head's status couldn't be confirmed. The last write
          # may be a stale success, and pending can only hold a merge back,
          # never let one through. Running the workflow again sets the real
          # verdict.
          fail_closed() {
            timeout 60 gh api -X POST "repos/$GH_REPO/statuses/$1" --silent -f state=pending \
              -f context="Human approval" -f target_url="$RUN_URL" \
              -f description="Couldn't check the reviews. Run the Human approval workflow again." ||
              echo "::error::Couldn't set $1 to pending either."
          }

          if [ "$EVENT" = workflow_dispatch ]; then
            if ! [[ "$PR" =~ ^[0-9]+$ ]]; then
              echo "::error::Not a pull request number: $PR"
              exit 1
            fi
            deadline=$((SECONDS + HEAD_BUDGET))
            SHAS=$(gh api "repos/$GH_REPO/pulls/$PR" --jq .head.sha)
          fi
          # A head that fails doesn't stop the others; the job fails at the
          # end. SHAS lists the new head before the old one, and awk keeps
          # that order, so the status that matters is set first.
          failed=""
          for sha in $(tr ' ' '\n' <<<"$SHAS" | grep -xE '[0-9a-f]{40}' | grep -vx 0000000000000000000000000000000000000000 | awk '!seen[$0]++'); do
            deadline=$((SECONDS + HEAD_BUDGET))
            for attempt in 1 2 3; do
              if update "$sha"; then
                break
              fi
              if [ "$attempt" = 3 ] || past_deadline; then
                echo "::error::Couldn't set the Human approval status of $sha."
                fail_closed "$sha"
                failed+=" $sha"
                break
              fi
              echo "Trying $sha again in $((attempt * 15)) seconds."
              sleep $((attempt * 15))
            done
          done
          [ -z "$failed" ] || exit 1
