name: Labeler

# Sets the area labels of a pull request from its changed paths
# (.github/labeler.yml).
#
# pull_request_target is what lets this label pull requests from forks, and it
# is safe here only because the job never checks out or runs code from the
# pull request: the action lists the changed files through the API and reads
# its config from the base branch. Keep it that way; no checkout, no scripts.
#
# GitHub doesn't run a pull_request_target workflow on the pull request that
# adds it, so a change to this file is first seen on the next pull request.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Label by paths
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Pinned: this job has write access on pull_request_target.
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          # Removes an area label once the pull request no longer touches its paths.
          sync-labels: true
