name: Release

# Builds release binaries for a pushed `v*` tag and publishes them as a GitHub
# Release with SHA256SUMS, its minisign signature and a build provenance
# attestation.
#
# To release: set `version` in Cargo.toml, core/Cargo.toml and server/Cargo.toml, merge that,
# then run this workflow on main with that version:
#
#   gh workflow run release.yml --ref main -f version=1.2.3
#
# The tag job tags main's commit as v1.2.3, and that tag starts the run that
# builds, signs and publishes. If that run fails, merge the fix and run the
# same command again: as long as v1.2.3 has no published release, the tag job
# moves the tag to the new commit, so nobody has to force-push a tag. Pushing
# a tag by hand still works too.
#
# A release waits for approval twice, from a required reviewer of the
# environment: the tag job (`release-tagging`) and the publish job
# (`release-signing`). Approve each under "Review deployments" on the run.
#
# The tag job pushes with a token from the release tagger GitHub App, the
# only actor besides admins that the `releases` tag ruleset lets create or
# move v* tags. The workflow token cannot (GitHub does not accept GitHub
# Actions as a bypass actor there), and tags it pushed would start no workflow.
#
# Do not create the release on GitHub by hand: the publish job makes it as a
# draft, uploads the archives and then publishes it. A release published before
# that has no archives, and with immutable releases on it can no longer take
# any.
#
# Nightly builds: every night, if main changed since the last nightly, this
# workflow builds main as `X.Y.(Z+1)-nightly.YYYYMMDDHHMM` (the next patch
# version, so a nightly sorts after the release it follows and before the one
# it leads to) and publishes it as a pre-release under that tag, with no `v`:
# the `releases` ruleset keeps v* tags for releases. It runs by itself and
# waits for no approval. It is signed with the nightly key, not the release
# key: the updater accepts that key for nightly versions only, so a nightly
# can never pass for a release. Pre-releases are never GitHub's latest
# release, so the stable channel and the install scripts don't see them; only
# an install that follows the nightly channel (`arakun update --channel
# nightly`, or Settings › General › Nightly builds) takes them. The nightly
# job keeps the newest 14. To build one now, even if main has not changed:
#
#   gh workflow run release.yml --ref main -f nightly=true
#
# - The version job fails a tag that is not `v` plus the version in
#   Cargo.toml, since `arakun --version` and the crash reports print that
#   version. It also fails when the app and arakun-server versions differ.
# - The CI jobs (ci.yml) run next to the builds, and the notarize and publish
#   jobs wait for them, so a tag on a commit that fails them never publishes.
#   The builds take 7-13 minutes and CI about 3 (longer when the macOS job
#   queues), so waiting for CI before building only made each run longer. For
#   a tag, every CI job runs, unless they already ran and passed on main for
#   the same commit (see the main-ci job). They restore main's cache like any
#   CI run, but nothing they build goes into the archives.
# - A dry run (a pull request that changes this file, or a manual run) builds,
#   smoke-tests and uploads the archives as `arakun-dev-<short sha>-…`, and
#   does not publish. Only a pushed tag publishes; a manual run never does,
#   even on a tag. A manual run with `version` only tags.
# - Linux x86_64 and arm64, Windows x86_64 (MSVC) and macOS arm64. No Intel
#   Mac build. Each Linux build runs natively on a runner of its architecture.
# - arakun-server (server/), the server without the window, for Linux only: as
#   `arakun-server-<tag>-linux-<arch>.tar.gz`, built by the Linux job in the
#   same container, so it has the same glibc floor. On macOS and Windows
#   the app's `arakun server` does the same. `arakun.dev/install-server` and
#   `tools/install-release.sh --server` install it.
# - macOS: Arakun.app made by tools/macos-app.sh, as tools/install.sh makes it,
#   in a disk image made by tools/macos-dmg.py that opens as a branded window
#   with an Applications link to drag it to. The build job signs the app ad-hoc.
#   For a tag or a manual run, the notarize job signs the app inside the image
#   again with the Developer ID certificate, has Apple notarize it and staples
#   the ticket, then does the same for the image, so Gatekeeper opens both
#   however they were downloaded. A pull request's dry run stops at the ad-hoc
#   image: it gets no secrets.
# - Linux builds inside an ubuntu:22.04 container, so the binary needs glibc 2.35
#   or newer (Ubuntu 22.04+, Debian 12+). A runner image links against its own,
#   newer glibc (ubuntu-24.04: 2.39), and the binary then refuses to start on
#   older systems. A step after the build fails if the floor is exceeded.
# - Built with the default `browser` feature, so each download carries CEF
#   156.0.15 (Chromium), the version the `cef` crate in Cargo.lock is built for:
#   Linux in a cef/ folder next to the binary, Windows next to arakun.exe with
#   arakun-helper.exe, macOS as Chromium Embedded Framework.framework inside
#   Arakun.app. Each job downloads its platform's archive, checks it against a
#   pinned SHA-1 before unpacking it, and points the build at it: Linux as
#   ci.yml's clippy-browser job does, macOS and Windows with
#   tools/fetch-cef.py. The `cef` crate's own download is not used: it trusts
#   the CDN's index, which has also grown past what its HTTP client reads.
#   macOS and Windows build CEF's wrapper with CMake and Ninja from
#   tools/build-requirements.txt.
# - Dependencies resolve exactly as in ci.yml (same Cargo.toml and --locked, no
#   rewriting of the [patch] section), so this builds wherever ci.yml does.
#   CI_CARGO_CONFIG is not used: it only tunes the dev profile.
# - No build cache: every release builds cold, so nothing another run saved can
#   end up in a published binary. Depot Cache does not keep refs apart.
#   The provenance attestation depends on this: it says which workflow and
#   commit built an archive, which only holds if nothing else went into it.

on:
  push:
    tags: ["v*"]
  # Dry runs: a change to this file or to the macOS bundle, image or icon, or a manual
  # run from the Actions tab, builds the archives without publishing, so a
  # broken release build shows up before a tag.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - tools/macos-app.sh
      - tools/macos-dmg.py
      - tools/macos-dmg-requirements.txt
      - tools/build-requirements.txt
      - tools/fetch-cef.py
      - tools/Arakun.icon/**
      - assets/brand/dmg-background*.png
  workflow_dispatch:
    inputs:
      version:
        description: "Release this version: tag main's commit as v<version> (empty: dry run)"
        type: string
        default: ""
      nightly:
        description: "Publish a nightly build of main now"
        type: boolean
        default: false
  # The nightly build. GitHub runs schedules on main only.
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Cargo.toml keeps line tables in release builds (debug = 1); the published
  # binaries leave them out, which keeps the archives small. Windows still
  # ships a .pdb with function names only (see its cargo build step).
  CARGO_PROFILE_RELEASE_DEBUG: 0
  # Lets the binaries update themselves (src/update.rs). A build from source
  # never does, since a release would take its browser away.
  ARAKUN_RELEASE_BUILD: "1"

jobs:
  # A manual run with `version`: tags main, and the tag starts the release run.
  # Every other job skips in this run.
  tag:
    name: Tag
    if: inputs.version != ''
    runs-on: depot-ubuntu-24.04
    # Shared with the publish job, so the tag never moves while a run checks
    # it and publishes, and two runs for one version never race to move it.
    concurrency:
      group: release-tag-v${{ inputs.version }}
    # Holds the app's key, and takes main only:
    #
    #   RELEASE_TAGGER_CLIENT_ID     (variable) the app's client ID
    #   RELEASE_TAGGER_PRIVATE_KEY   (secret) a private key of the app
    #
    # The app needs Contents: read and write on this repository, and is the
    # bypass actor on the `releases` tag ruleset.
    environment: release-tagging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::run this on main (--ref main), not $GITHUB_REF; a release is cut from main"
            exit 1
          fi
          app=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [ "$VERSION" != "$app" ]; then
            echo "::error::version $VERSION is not the version in main's Cargo.toml ($app); merge the version bump first"
            exit 1
          fi

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.RELEASE_TAGGER_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_TAGGER_PRIVATE_KEY }}
          permission-contents: write

      - name: Tag
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ inputs.version }}
          SHA: ${{ github.sha }}
        run: |
          # A published release is immutable, so its tag must not move. A
          # draft is left by a run that failed while publishing; the next run
          # takes it over.
          published=$(gh api --paginate "repos/$GH_REPO/releases" \
            --jq ".[] | select(.tag_name == \"$TAG\" and (.draft | not)) | .html_url")
          if [ -n "$published" ]; then
            echo "::error::$TAG is already released ($published); bump the version for a new release"
            exit 1
          fi

          # An annotated tag, like one made by hand, so `git describe` finds it.
          object=$(gh api "repos/$GH_REPO/git/tags" -f tag="$TAG" -f message="Arakun $TAG" \
            -f object="$SHA" -f type=commit --jq .sha)
          if old=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha 2>/dev/null); then
            if [ "$old" = "$SHA" ]; then
              echo "::error::$TAG already points at $SHA; re-run its failed release run instead"
              exit 1
            fi
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$TAG" -f sha="$object" -F force=true >/dev/null
            echo "::notice::moved $TAG from $old to $SHA"
          else
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$object" >/dev/null
            echo "::notice::created $TAG at $SHA"
          fi
          echo "::notice::the release runs on the tag: $GITHUB_SERVER_URL/$GH_REPO/actions/workflows/release.yml?query=branch%3A$TAG"

  ci:
    name: CI
    needs: [version, main-ci]
    if: inputs.version == '' && needs.version.outputs.skip != 'true'
    uses: $/.github/workflows/ci.yml
    with:
      main-passed: ${{ needs.main-ci.outputs.passed == 'true' }}
    # A called workflow gets at most what its caller job allows; the "What
    # changed" job in ci.yml lists a pull request's files.
    permissions:
      contents: read
      pull-requests: read

  # Runs for dry runs too, so the builds can always need it; only a tag push
  # compares the tag. For a nightly it picks the version, and skips the run
  # when the last nightly already built this commit.
  version:
    name: Version
    if: inputs.version == ''
    runs-on: depot-ubuntu-24.04
    outputs:
      # What the archives are named by: the tag, or the nightly's version.
      # Empty for a dry run.
      tag: ${{ steps.nightly.outputs.version || (github.event_name == 'push' && github.ref_name || '') }}
      # The version the binaries say, for a nightly; empty otherwise.
      nightly: ${{ steps.nightly.outputs.version }}
      # The nightly before this one, for the release notes.
      last-nightly: ${{ steps.nightly.outputs.last }}
      skip: ${{ steps.nightly.outputs.skip }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare the tag and the crate versions
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          read_version() { python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["package"]["version"])' "$1"; }
          app=$(read_version Cargo.toml)
          server=$(read_version server/Cargo.toml)
          core=$(read_version core/Cargo.toml)
          echo "Cargo.toml: $app, server/Cargo.toml: $server, core/Cargo.toml: $core, tag: ${TAG:-none}"
          if [ "$app" != "$server" ] || [ "$app" != "$core" ]; then
            echo "::error::Cargo.toml says $app, server/Cargo.toml $server and core/Cargo.toml $core; they are released together"
            exit 1
          fi
          if [ -n "$TAG" ] && [ "$TAG" != "v$app" ]; then
            echo "::error::tag $TAG does not match version $app in Cargo.toml; set it to ${TAG#v} and tag that commit, or tag v$app"
            exit 1
          fi

      - name: Nightly version
        id: nightly
        if: github.event_name == 'schedule' || inputs.nightly
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::a nightly is built from main (--ref main), not $GITHUB_REF"
            exit 1
          fi
          # The newest nightly, and the commit its tag is on.
          last=$(gh api "repos/$GH_REPO/releases?per_page=50" \
            --jq '[.[] | select(.prerelease and (.tag_name | test("^[0-9]+[.][0-9]+[.][0-9]+-nightly[.][0-9]+$")))][0].tag_name // empty')
          if [ -n "$last" ] && [ "$EVENT" = schedule ] \
            && [ "$(gh api "repos/$GH_REPO/commits/$last" --jq .sha)" = "$SHA" ]; then
            echo "::notice::main has not changed since $last; no nightly tonight"
            echo skip=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          app=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          IFS=. read -r major minor patch <<< "$app"
          version="$major.$minor.$((patch + 1))-nightly.$(date -u +%Y%m%d%H%M)"
          echo "::notice::building nightly $version from $SHA (last nightly: ${last:-none})"
          { echo "version=$version"; echo "last=$last"; } >> "$GITHUB_OUTPUT"

  # A tag or a nightly is on a commit that main's CI already checked. If
  # that run passed with every Rust job run (none skipped because the commit
  # changed no Rust), the ci job skips its jobs instead of running them
  # again. The relay and teams jobs may have skipped: the archives hold no
  # relay or teams code, and changes there pass those jobs before they merge.
  # A run still going is waited
  # for: starting another would queue a second macOS job behind it. A
  # cancelled or failed run, or none (a tag pushed by hand on another
  # branch), runs CI here as before. This is its own job, not a step of
  # version, because the builds need version and must not wait for this.
  main-ci:
    name: Main's CI for this commit
    needs: version
    if: inputs.version == '' && needs.version.outputs.skip != 'true'
    runs-on: depot-ubuntu-24.04
    outputs:
      # "true" when ci.yml already passed on main for this commit.
      passed: ${{ steps.main-ci.outputs.passed }}
    permissions:
      # Reads main's CI runs and their jobs.
      actions: read
    steps:
      - name: Look up main's CI run
        id: main-ci
        # The job must not fail: the jobs that publish need ci, and a failed
        # job skips everything that needs it, even through ci. An error or a
        # timeout here only means ci runs as it would without the lookup.
        continue-on-error: true
        timeout-minutes: 95
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          runs() {
            gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?event=push&branch=main&head_sha=$SHA" \
              --jq "$1" || echo ""
          }
          # Up to 90 minutes, about the longest a macOS job has waited.
          for _ in $(seq 180); do
            [ -n "$(runs '.workflow_runs[] | select(.status != "completed") | .id')" ] || break
            echo "main's CI for $SHA is still running"
            sleep 30
          done
          for id in $(runs '.workflow_runs[] | select(.conclusion == "success") | .id'); do
            # filter=latest: a job re-run after it failed counts by its last attempt.
            other=$(gh api --paginate "repos/$GH_REPO/actions/runs/$id/jobs?filter=latest" \
              --jq '.jobs[] | select(.conclusion != "success")
                | select(.conclusion != "skipped" or (.name != "Relay (types and tests)" and .name != "Teams (types and tests)" and .name != "iOS (Swift tests and simulator build)"))
                | "\(.name): \(.conclusion)"') || continue
            if [ -z "$other" ]; then
              echo "::notice::main's CI passed on $SHA ($GITHUB_SERVER_URL/$GH_REPO/actions/runs/$id); not running it again"
              echo passed=true >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "run $id passed without running every Rust job:"
            echo "$other"
          done
          echo "::notice::no run of main's CI passed every Rust job on $SHA; running CI"

  linux:
    name: Build (Linux ${{ matrix.arch }})
    needs: version
    if: needs.version.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep CEF_ARCHIVE and CEF_SHA1 in step with the clippy-browser job in
          # ci.yml. The SHA-1 is the one cef-builds publishes.
          - arch: x86_64
            runner: depot-ubuntu-24.04-8
            target: x86_64-unknown-linux-gnu
            cef_archive: cef_binary_156.0.15+gcf671c0+chromium-156.0.8078.80_linux64_minimal.tar.bz2
            cef_sha1: 09235427222e026a4f34399742df27c5d98a4f8a
          - arch: arm64
            runner: depot-ubuntu-24.04-arm-8
            target: aarch64-unknown-linux-gnu
            cef_archive: cef_binary_156.0.15+gcf671c0+chromium-156.0.8078.80_linuxarm64_minimal.tar.bz2
            cef_sha1: 85602db8e813ad824b45ae54218476aa3d91d561
    runs-on: ${{ matrix.runner }}
    # The image's glibc is the binary's floor; see the header. Raising it drops
    # support for older distributions, so update README.md and GLIBC_FLOOR too.
    # Pinned by digest so a moved tag cannot change what the release is built in.
    # To update: look up the current digest of the ubuntu:22.04 tag and replace it.
    # The digest is the multi-platform index, so each runner pulls its own architecture.
    container: ubuntu:22.04@sha256:74b12b11ffa550fba1929ad4d8d16533c34f6612728469671afba1b03b66881c
    env:
      # What the binaries say for a nightly; build.rs falls back to Cargo.toml.
      ARAKUN_VERSION: ${{ needs.version.outputs.nightly }}
      GLIBC_FLOOR: "2.35"
      CEF_ARCHIVE: ${{ matrix.cef_archive }}
      CEF_SHA1: ${{ matrix.cef_sha1 }}
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
    steps:
      # Same libraries as ci.yml (installed directly: cache-apt-pkgs-action expects
      # a runner, not a container), plus what the bare image lacks. Before checkout,
      # which needs git to make a repository rather than a tarball download.
      - name: System packages
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev \
            libfontconfig1-dev libfreetype-dev libvulkan-dev libssl-dev \
            bzip2 cmake ninja-build

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # CPU and memory use for the weekly runner-sizing report.
      - uses: $/.github/actions/runner-usage

      # The version in rust-toolchain.toml. The bare image has no rustup, so
      # install it first, without a toolchain of its own.
      - name: Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install --no-self-update

      # As ci.yml's clippy-browser job does, without its cache (see the header).
      # $RUNNER_TEMP/cef is the runtime the archive carries; its sdk/ is only for
      # the build, through the .cef-sdk link tools/install-cef.sh makes.
      - name: Prepare CEF
        run: |
          archive="$RUNNER_TEMP/$CEF_ARCHIVE"
          url="https://cef-builds.spotifycdn.com/$(printf %s "$CEF_ARCHIVE" | sed 's/+/%2B/g')"
          curl -fsSL --retry 3 -o "$archive" "$url"
          echo "$CEF_SHA1  $archive" | sha1sum -c -
          mkdir -p "$RUNNER_TEMP/cef-dist"
          tar -xjf "$archive" -C "$RUNNER_TEMP/cef-dist" --strip-components=1
          rm "$archive"
          tools/install-cef.sh "$RUNNER_TEMP/cef-dist" "$RUNNER_TEMP/cef"
          rm -rf "$RUNNER_TEMP/cef-dist"

      - name: cargo build
        run: cargo build --release --locked --target "$TARGET"

      # A build of its own: built with the app, Cargo would give both one GPUI,
      # with the display code in it (see server/Cargo.toml).
      - name: cargo build arakun-server
        run: cargo build --release --locked -p arakun-server --target "$TARGET"

      # The runtime's libraries too: the browser loads them into this process.
      - name: Check glibc floor
        run: |
          app=target/$TARGET/release/arakun
          server=target/$TARGET/release/arakun-server
          for bin in "$app" "$server" "$RUNNER_TEMP"/cef/*.so*; do
            max=$(objdump -T "$bin" | grep -oE 'GLIBC_[0-9.]+' | sed 's/^GLIBC_//' | sort -Vu | tail -1)
            if [ -z "$max" ]; then
              [ "$bin" != "$app" ] && [ "$bin" != "$server" ] || { echo "::error::no GLIBC_ symbol versions found in $bin"; exit 1; }
              echo "$bin: no GLIBC_ symbol versions"
              continue
            fi
            echo "$bin: highest GLIBC_ symbol version: $max (floor $GLIBC_FLOOR)"
            if [ "$(printf '%s\n' "$max" "$GLIBC_FLOOR" | sort -V | tail -1)" != "$GLIBC_FLOOR" ]; then
              echo "::error::$bin needs glibc $max, above the $GLIBC_FLOOR floor"
              objdump -T "$bin" | grep -F "GLIBC_$max"
              exit 1
            fi
          done

      - name: Package
        env:
          # The tag or the nightly's version. Empty on a dry run; then the name
          # carries the commit (for a pull request its head, not the merge
          # commit GitHub tests).
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        # Steps in this container run under sh (dash), not bash: POSIX only.
        run: |
          tag=${TAG:-dev-$(printf %.7s "$SHA")}
          name="arakun-$tag-linux-$ARCH"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/arakun" "dist/$name/"
          strip "dist/$name/arakun"
          cp LICENSE NOTICE README.md "dist/$name/"
          # Next to the binary, where core/src/browser/loader.rs looks first. Without
          # sdk/, which only the build reads.
          cp -r "$RUNNER_TEMP/cef" "dist/$name/cef"
          rm -rf "dist/$name/cef/sdk"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          du -sh "dist/$name" "dist/$name.tar.gz"
          # The server: one binary, no browser.
          server="arakun-server-$tag-linux-$ARCH"
          mkdir -p "dist/$server"
          cp "target/$TARGET/release/arakun-server" "dist/$server/"
          strip "dist/$server/arakun-server"
          cp LICENSE NOTICE README.md "dist/$server/"
          tar -C dist -czf "dist/$server.tar.gz" "$server"
          du -sh "dist/$server" "dist/$server.tar.gz"

      # The archives as a user gets them: they unpack, and the binaries load and run.
      - name: Smoke test
        env:
          # As in Package: a glob can't tell the app's folder from the server's
          # once a nightly's name starts with a digit.
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          tag=${TAG:-dev-$(printf %.7s "$SHA")}
          dir="smoke/arakun-$tag-linux-$ARCH"
          mkdir smoke
          for archive in dist/*.tar.gz; do tar -C smoke -xzf "$archive"; done
          app=$dir/arakun
          server=smoke/arakun-server-$tag-linux-$ARCH/arakun-server
          "$app" --version
          "$server" --version
          test -f "$dir/cef/libcef.so"
          test -f "$dir/cef/locales/en-US.pak"
          # Loaded on the first browser tab, never at startup.
          if objdump -p "$app" | grep -q 'NEEDED.*libcef'; then
            echo "::error::arakun links libcef.so at startup"
            exit 1
          fi
          # Made for machines with no display: it must not need their libraries,
          # directly or through another library. The check ci.yml runs on its build.
          tools/check-server-libs.sh "$server"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  windows:
    name: Build (Windows x86_64)
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: depot-windows-2025-8
    env:
      # What the binaries say for a nightly; build.rs falls back to Cargo.toml.
      ARAKUN_VERSION: ${{ needs.version.outputs.nightly }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # CPU and memory use for the weekly runner-sizing report.
      - uses: $/.github/actions/runner-usage

      # The version in rust-toolchain.toml; the build target is the host's.
      - name: Rust toolchain
        run: rustup toolchain install --no-self-update

      # No cache: see the header.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      # CMake and Ninja for CEF's wrapper. The cmake crate finds MSVC by itself.
      - name: Build tools
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP build-tools
          python -m venv $venv
          & "$venv\Scripts\pip" install --require-hashes --no-deps --only-binary :all: -r tools/build-requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "pip exited with $LASTEXITCODE" }
          "$venv\Scripts" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      # See the header. The SHA-1 is the one cef-builds publishes.
      - name: Prepare CEF
        env:
          CEF_ARCHIVE: cef_binary_156.0.15+gcf671c0+chromium-156.0.8078.80_windows64_minimal.tar.bz2
          CEF_SHA1: b690e035689ee20ba9d2500ac8953815bc7ed46a
        shell: pwsh
        run: |
          python tools/fetch-cef.py $env:CEF_ARCHIVE $env:CEF_SHA1 "$env:RUNNER_TEMP/cef"
          if ($LASTEXITCODE -ne 0) { throw "fetch-cef.py exited with $LASTEXITCODE" }

      # gpui compiles its HLSL shaders with fxc.exe from the Windows SDK in
      # release builds; the runner image ships the SDK (GPUI_FXC_PATH overrides).
      # build.rs copies the CEF runtime from CEF_PATH next to arakun.exe.
      # Without debug info Cargo strips by default, and the linker then writes no
      # .pdb. Kept, the .pdb holds the function names that crash reports read
      # (src/telemetry.rs); a binary alone has only those of Windows' own DLLs.
      - name: cargo build
        env:
          CEF_PATH: ${{ runner.temp }}/cef
          CARGO_PROFILE_RELEASE_STRIP: none
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package
        shell: pwsh
        env:
          # The tag or the nightly's version. Empty on a dry run; then the name
          # carries the commit (for a pull request its head, not the merge
          # commit GitHub tests).
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $tag = if ($env:TAG) { $env:TAG } else { "dev-" + $env:SHA.Substring(0, 7) }
          $name = "arakun-$tag-windows-x86_64"
          $out = "dist/$name"
          $release = "target/x86_64-pc-windows-msvc/release"
          New-Item -ItemType Directory -Force -Path "$out/locales" | Out-Null
          # arakun-helper.exe starts CEF's child processes without a console each.
          Copy-Item "$release/arakun.exe", "$release/arakun-helper.exe" $out
          # Crash reports find it next to arakun.exe; the updater carries it along.
          Copy-Item "$release/arakun.pdb" $out
          # The CEF runtime build.rs copied: DLLs, .pak, .bin, .dat and the
          # SwiftShader manifest, not the import libraries. The two locales
          # core/src/browser/runtime.rs picks from, as on Linux.
          Copy-Item "$release/*" $out -Include *.dll, *.pak, *.bin, *.dat, *.json
          Copy-Item "$release/locales/en-US.pak", "$release/locales/es.pak", "$release/locales/es-419.pak" "$out/locales"
          Copy-Item LICENSE, NOTICE, README.md $out
          Get-ChildItem -Recurse $out | Format-Table -AutoSize Length, FullName
          Compress-Archive -Path $out -DestinationPath "dist/$name.zip"
          "{0:N0} MB" -f ((Get-Item "dist/$name.zip").Length / 1MB)

      # The archive as a user gets it: unpacks, and the binary loads and runs.
      - name: Smoke test
        shell: pwsh
        run: |
          Expand-Archive -Path (Get-Item dist/*.zip).FullName -DestinationPath smoke
          $exe = (Get-Item smoke/*/arakun.exe).FullName
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "arakun.exe --version exited with $LASTEXITCODE" }
          $dir = Split-Path $exe
          foreach ($f in 'arakun-helper.exe', 'arakun.pdb', 'libcef.dll', 'icudtl.dat', 'resources.pak', 'locales/en-US.pak') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "the archive has no $f" }
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x86_64
          path: dist/*.zip
          if-no-files-found: error

  macos:
    name: Build (macOS arm64)
    needs: version
    if: needs.version.outputs.skip != 'true'
    # A fixed image rather than macos-latest, so the toolchain does not change
    # under a release. arm64. On GitHub's runners, like ci.yml's macOS job: on
    # 19 Nov 2026 Depot's macOS runners took no job for hours.
    # macOS 26: actool from Xcode 26, which compiles the Liquid Glass icon,
    # crashes on macOS 15 (its asset service needs macOS 26 frameworks).
    # No runner-usage step: it supports only Linux and Windows.
    runs-on: macos-26
    env:
      # What the binaries say for a nightly; build.rs falls back to Cargo.toml.
      ARAKUN_VERSION: ${{ needs.version.outputs.nightly }}
      # The oldest macOS the binary runs on. LSMinimumSystemVersion in
      # Info.plist (tools/macos-app.sh) says the same.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version in rust-toolchain.toml; the build target is the host's.
      - name: Rust toolchain
        run: rustup toolchain install --no-self-update

      # For CMake and Ninja, and dmgbuild (tools/macos-dmg.py), which needs 3.10
      # or newer; the system python3 is older. No cache: see the header.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      # CMake and Ninja for CEF's wrapper.
      - name: Build tools
        run: |
          python -m venv "$RUNNER_TEMP/build-tools"
          "$RUNNER_TEMP/build-tools/bin/pip" install --require-hashes --no-deps --only-binary :all: \
            -r tools/build-requirements.txt
          echo "$RUNNER_TEMP/build-tools/bin" >> "$GITHUB_PATH"

      # As on Windows.
      - name: Prepare CEF
        env:
          CEF_ARCHIVE: cef_binary_156.0.15+gcf671c0+chromium-156.0.8078.80_macosarm64_minimal.tar.bz2
          CEF_SHA1: bcdd1877edb300b0fb91d8f71c0b14aae256cd0f
        run: python tools/fetch-cef.py "$CEF_ARCHIVE" "$CEF_SHA1" "$RUNNER_TEMP/cef"

      - name: cargo build
        env:
          CEF_PATH: ${{ runner.temp }}/cef
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: dmgbuild
        run: |
          python -m venv "$RUNNER_TEMP/dmg"
          "$RUNNER_TEMP/dmg/bin/pip" install --require-hashes --no-deps --only-binary :all: \
            -r tools/macos-dmg-requirements.txt

      - name: Package
        env:
          # The tag or the nightly's version. Empty on a dry run; then the name
          # carries the commit (for a pull request its head, not the merge
          # commit GitHub tests).
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          tag=${TAG:-dev-$(printf %.7s "$SHA")}
          name="arakun-$tag-macos-arm64"
          mkdir -p work dist
          # The one the build used (Prepare CEF).
          framework="$RUNNER_TEMP/cef/Chromium Embedded Framework.framework"
          [ -d "$framework" ] || { echo "::error::no CEF framework at $framework"; exit 1; }
          tools/macos-app.sh --strip --framework "$framework" \
            target/aarch64-apple-darwin/release/arakun work/Arakun.app
          "$RUNNER_TEMP/dmg/bin/python" tools/macos-dmg.py work/Arakun.app "dist/$name.dmg"
          du -sh work/Arakun.app "dist/$name.dmg"

      # The image as a user gets it: it mounts with the app, the Applications
      # link and the window layout, the signature holds, and the binary loads
      # and runs.
      - name: Smoke test
        run: |
          mnt=$RUNNER_TEMP/smoke
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mnt" dist/*.dmg
          trap 'hdiutil detach "$mnt"' EXIT
          ls -la "$mnt"
          app=$mnt/Arakun.app
          [ "$(readlink "$mnt/Applications")" = /Applications ]
          test -f "$mnt/.DS_Store"
          test -f "$mnt/.VolumeIcon.icns"
          ls "$mnt"/.background.*
          # Extended attributes on the bundle, which codesign --strict refuses.
          xattr -l "$app"
          codesign --verify --deep --strict "$app"
          test -f "$app/Contents/Resources/Assets.car"
          test -f "$app/Contents/Resources/LICENSE"
          test -f "$app/Contents/Frameworks/Chromium Embedded Framework.framework/Chromium Embedded Framework"
          # What the notarize job signs before the framework.
          echo "::group::Mach-O files in the framework"
          find "$app/Contents/Frameworks" -type f -exec file {} + | grep 'Mach-O'
          echo "::endgroup::"
          # Which images the icon catalog holds, for each macOS version and appearance.
          echo "::group::Assets.car"; xcrun assetutil --info "$app/Contents/Resources/Assets.car"; echo "::endgroup::"
          "$app/Contents/MacOS/arakun" --version

      # Ad-hoc signed. Where the notarize job runs, it replaces this artifact
      # with the notarized image under the same name, so a run never offers
      # the ad-hoc app next to the signed one.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-arm64
          path: dist/*.dmg
          if-no-files-found: error

  # A job of its own so the signing certificate and the App Store Connect key
  # never reach a job that runs build scripts: this one runs no cargo and no
  # code from the repository. It needs these secrets (repository secrets, or
  # secrets of the `release` environment, which can limit them to v* tags and
  # main):
  #
  #   MACOS_CERTIFICATE           base64 of a .p12 export of the "Developer ID
  #                               Application" certificate with its private key
  #   MACOS_CERTIFICATE_PASSWORD  the password of that .p12
  #   APPLE_API_KEY               the text of the App Store Connect API key
  #                               (AuthKey_<id>.p8), role Developer
  #   APPLE_API_KEY_ID            that key's ID
  #   APPLE_API_ISSUER_ID         the issuer ID shown above the keys list
  macos-notarize:
    name: Notarize (macOS arm64)
    # CI too, so Apple never notarizes a commit that fails it.
    needs: [ci, macos]
    if: github.event_name != 'pull_request'
    # Same image as the build job. Depot's macOS 15 runners left this job
    # queued with no runner.
    runs-on: macos-26
    environment: release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-arm64
          path: adhoc

      - name: Import the signing certificate
        id: keychain
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          [ -n "$CERTIFICATE" ] && [ -n "$CERTIFICATE_PASSWORD" ] || {
            echo "::error::MACOS_CERTIFICATE and MACOS_CERTIFICATE_PASSWORD are not set; see the comment above this job"
            exit 1
          }
          keychain=$RUNNER_TEMP/signing.keychain-db
          password=$(openssl rand -hex 24)
          printf %s "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          # -x: the private key cannot be exported again, only used by codesign.
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -x
          rm "$RUNNER_TEMP/certificate.p12"
          # Lets codesign use the key without a dialog nobody can click.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          # Added to the search list, which codesign and find-identity read.
          old=()
          while read -r k; do old+=("$(echo "$k" | tr -d '"')"); done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${old[@]}"
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | awk '/"Developer ID Application: / { print $2; exit }')
          [ -n "$identity" ] || {
            echo "::error::the certificate is not a valid Developer ID Application certificate"
            security find-identity -v -p codesigning "$keychain"
            exit 1
          }
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      # The app is signed and stapled inside the image, so the window layout
      # tools/macos-dmg.py made stays as it is and this job needs no code from
      # the repository.
      - name: Open the image
        id: image
        run: |
          rw=$RUNNER_TEMP/rw.dmg
          hdiutil convert adhoc/*.dmg -format UDRW -o "$rw"
          # codesign writes the signed copy of a file next to it before it
          # replaces it, so the volume needs more free space than the biggest
          # file: the CEF framework binary, about 300 MB. Without it codesign
          # stops with "internal error in Code Signing subsystem". Package
          # shrinks the image again.
          # -limits prints the smallest, current and largest size, in sectors.
          # read fails at the end of input without a newline; the count decides.
          read -r -a limits < <(hdiutil resize -limits "$rw" | tr -cs '0-9' ' ') || true
          [ "${#limits[@]}" = 3 ] || { echo "::error::cannot read hdiutil resize -limits: ${limits[*]}"; exit 1; }
          hdiutil resize -sectors $(( limits[1] + 2 * 1024 * 1024 * 1024 / 512 )) "$rw"
          mnt=$RUNNER_TEMP/image
          hdiutil attach -nobrowse -noautoopen -mountpoint "$mnt" "$rw"
          echo "rw=$rw" >> "$GITHUB_OUTPUT"
          echo "mnt=$mnt" >> "$GITHUB_OUTPUT"

      - name: Sign the app
        env:
          IDENTITY: ${{ steps.keychain.outputs.identity }}
          KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
          APP: ${{ steps.image.outputs.mnt }}/Arakun.app
        run: |
          # Hardened runtime, which notarization requires. Inside out: the
          # framework's libraries, the framework, then the app, since signing a
          # bundle does not sign the code nested in it. There are no helper apps:
          # CEF's child processes are arakun itself again (core/src/browser/runtime.rs),
          # so the one binary takes the entitlement Chromium gives its renderer
          # and GPU helpers: V8 and SwiftShader write JIT code.
          # Extended attributes first: codesign --strict refuses a bundle with
          # Finder information on it.
          xattr -cr "$APP"
          sign() {
            codesign --force --timestamp --options runtime \
              --sign "$IDENTITY" --keychain "$KEYCHAIN" "$@"
          }
          fw="$APP/Contents/Frameworks/Chromium Embedded Framework.framework"
          if [ -d "$fw" ]; then
            # Every Mach-O in it (libraries, and helpers such as
            # chrome_crashpad_handler), or notarization refuses the app.
            find "$fw" -type f -print0 | while IFS= read -r -d '' f; do
              if file -b "$f" | grep -q '^Mach-O'; then sign "$f"; fi
            done
            sign "$fw"
          fi
          entitlements=$RUNNER_TEMP/entitlements.plist
          cat > "$entitlements" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.cs.allow-jit</key><true/>
          </dict>
          </plist>
          EOF
          sign --entitlements "$entitlements" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --entitlements - "$APP"

      # The API key, and notarize(), which submits a file, waits, prints
      # Apple's log and staples the ticket. It runs twice: for the app, so it
      # opens offline once it is copied out of the image, and for the image.
      - name: Notary credentials
        id: notarize
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          [ -n "$API_KEY" ] && [ -n "$API_KEY_ID" ] && [ -n "$API_ISSUER_ID" ] || {
            echo "::error::APPLE_API_KEY, APPLE_API_KEY_ID and APPLE_API_ISSUER_ID are not set; see the comment above this job"
            exit 1
          }
          key=$RUNNER_TEMP/AuthKey.p8
          printf '%s\n' "$API_KEY" > "$key"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          cat > "$RUNNER_TEMP/notarize.sh" <<'EOF'
          # notarize FILE STAPLE: submits FILE and staples the ticket to STAPLE.
          notarize() {
            auth=(--key "$KEY" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID")
            # Goes on after a refusal, to print the log below; the status decides.
            xcrun notarytool submit "$1" "${auth[@]}" \
              --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notary.json" || true
            cat "$RUNNER_TEMP/notary.json"
            id=$(plutil -extract id raw "$RUNNER_TEMP/notary.json")
            status=$(plutil -extract status raw "$RUNNER_TEMP/notary.json")
            # The log says why Apple refused, and lists warnings when it accepts.
            xcrun notarytool log "$id" "${auth[@]}" || true
            [ "$status" = Accepted ] || { echo "::error::notarization of $1 ended with status $status"; exit 1; }
            # The ticket lets Gatekeeper check it offline.
            xcrun stapler staple "$2"
            xcrun stapler validate "$2"
          }
          EOF

      - name: Notarize the app
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          KEY: ${{ steps.notarize.outputs.key }}
          APP: ${{ steps.image.outputs.mnt }}/Arakun.app
        run: |
          . "$RUNNER_TEMP/notarize.sh"
          # notarytool takes a zip, not a bare app; the ticket goes on the app
          # in the image, so this zip is thrown away.
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          notarize "$RUNNER_TEMP/notarize.zip" "$APP"

      - name: Package
        env:
          IDENTITY: ${{ steps.keychain.outputs.identity }}
          KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
          RW: ${{ steps.image.outputs.rw }}
          MNT: ${{ steps.image.outputs.mnt }}
        run: |
          # What macOS leaves on a volume it mounted writable.
          rm -rf "$MNT/.fseventsd" "$MNT/.Trashes"
          # Spotlight can hold the volume for a moment.
          hdiutil detach "$MNT" || { sleep 5; hdiutil detach -force "$MNT"; }
          # Gives back the room Open the image added, so the mounted volume is
          # not mostly empty.
          hdiutil resize -sectors min "$RW"
          mkdir dist
          dmg="dist/$(basename adhoc/*.dmg)"
          hdiutil convert "$RW" -format ULFO -o "$dmg"
          # The image's own signature, which Gatekeeper checks on a download.
          codesign --timestamp --sign "$IDENTITY" --keychain "$KEYCHAIN" "$dmg"
          codesign --verify --strict --verbose=2 "$dmg"

      - name: Notarize the image
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          KEY: ${{ steps.notarize.outputs.key }}
        run: |
          . "$RUNNER_TEMP/notarize.sh"
          dmg=$(echo dist/*.dmg)
          notarize "$dmg" "$dmg"

      - name: Remove the API key
        if: always() && steps.notarize.outputs.key != ''
        env:
          KEY: ${{ steps.notarize.outputs.key }}
        run: rm -f "$KEY"

      # Before the smoke test runs the binary: it comes from a job that ran
      # third-party build scripts, and must not find the signing key.
      - name: Remove the keychain
        if: always() && steps.keychain.outputs.keychain != ''
        env:
          KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
        run: security delete-keychain "$KEYCHAIN"

      # The image as a user gets it: Gatekeeper accepts the image and the app
      # in it as notarized (what it checks for a browser download), and the
      # binary loads and runs.
      - name: Smoke test
        run: |
          dmg=$(echo dist/*.dmg)
          # The ticket is stapled to the image itself, not only to the app.
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg" 2>&1 | tee spctl.txt
          grep -q 'source=Notarized Developer ID' spctl.txt
          mnt=$RUNNER_TEMP/smoke
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mnt" "$dmg"
          trap 'hdiutil detach "$mnt"' EXIT
          app=$mnt/Arakun.app
          codesign --verify --deep --strict "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app" 2>&1 | tee spctl.txt
          grep -q 'source=Notarized Developer ID' spctl.txt
          "$app/Contents/MacOS/arakun" --version

      # Replaces the build job's ad-hoc artifact of the same name.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-arm64
          path: dist/*.dmg
          if-no-files-found: error
          overwrite: true

  release:
    name: Publish GitHub Release
    needs: [ci, linux, windows, macos-notarize]
    # Not on a manual run, even one started on a tag: that is a dry run.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: depot-ubuntu-24.04
    # For the release signing key, below.
    environment: release-signing
    # The tag job's group: it waits until this job has checked the tag and
    # published, and then refuses to move a released tag.
    concurrency:
      group: release-tag-${{ github.ref_name }}
    permissions:
      contents: write
      # For the provenance attestation. Only this job gets them: it runs no code
      # from the repository, while the build jobs run every build script.
      id-token: write
      attestations: write
    steps:
      # Only the public key, to check the signature against: this job runs no
      # code from the repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: repo
          sparse-checkout: assets/release-key.pub
          sparse-checkout-cone-mode: false

      # macos-arm64 is the notarized image: this job needs macos-notarize,
      # which replaced the build job's ad-hoc artifact.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: SHA256SUMS
        working-directory: dist
        run: |
          ls -l
          shopt -s nullglob
          archives=(*.tar.gz *.zip *.dmg)
          # The app for four platforms, and arakun-server for both Linux ones.
          [ ${#archives[@]} -eq 6 ] || { echo "::error::expected 6 archives, found ${#archives[@]}"; exit 1; }
          sha256sum "${archives[@]}" > SHA256SUMS
          cat SHA256SUMS

      # The updater (src/update.rs) refuses a release whose SHA256SUMS this key
      # did not sign, and the install scripts check it where they can. The key
      # lives only in the `release-signing` environment, which takes v* tags
      # and nothing else, so no branch or manual run can read it:
      #
      #   RELEASE_SIGNING_KEY           the secret key file `minisign -G` made
      #   RELEASE_SIGNING_KEY_PASSWORD  its password
      #
      # Its public half is assets/release-key.pub, also in both install
      # scripts and the README. They also accept assets/release-key-backup.pub,
      # whose secret half is kept offline: if this key is lost or leaked, sign
      # with the backup by hand, then ship a new key in a release it signs.
      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign

      - name: Sign SHA256SUMS
        working-directory: dist
        env:
          KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          PASSWORD: ${{ secrets.RELEASE_SIGNING_KEY_PASSWORD }}
          TAG: ${{ github.ref_name }}
        run: |
          [ -n "$KEY" ] && [ -n "$PASSWORD" ] || {
            echo "::error::RELEASE_SIGNING_KEY and RELEASE_SIGNING_KEY_PASSWORD are not set; see the comment above this step"
            exit 1
          }
          key=$RUNNER_TEMP/release.key
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$KEY" > "$key")
          # minisign reads the password from stdin when it is not a terminal.
          printf '%s\n' "$PASSWORD" | minisign -S -s "$key" -m SHA256SUMS -t "arakun $TAG SHA256SUMS"
          # The public key the binaries carry, so a wrong secret fails here
          # and not in every updater.
          minisign -V -p "$GITHUB_WORKSPACE/repo/assets/release-key.pub" -m SHA256SUMS

      # Signs which workflow run and commit built each archive, so
      # `gh attestation verify <archive> -R arakunhq/arakun` can check a download.
      # Before publishing, so a failure here leaves no unattested release.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      # The tag job moves a tag that has no published release yet. A run still
      # building the old commit must then not publish its archives under it.
      - name: Check the tag still points at this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          now=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
          if [ "$now" != "$SHA" ]; then
            echo "::error::$TAG moved to $now while this run built $SHA; the run on the new commit publishes it"
            exit 1
          fi

      # zizmor would have `gh release create` here. Moving over changes how a
      # re-run treats a release that already exists, which only a real tag can
      # test, so that is its own change.
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4 # zizmor: ignore[superfluous-actions]
        with:
          name: Arakun ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS
            dist/SHA256SUMS.minisig

  # The hosted relay ships with the release: once the release is out, deploy
  # the relay and phone page from its tag. A relay hotfix without a new
  # version, and its rules, are in relay-deploy.yml. It skips pre-releases.
  relay:
    name: Relay
    needs: release
    uses: $/.github/workflows/relay-deploy.yml
    # It lives in the `production` environment, which the called job uses.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    permissions:
      contents: read

  # The iOS app ships with the release too: once the release is out, upload
  # it to TestFlight from the tag. It skips pre-releases, and skips without
  # failing until the `testflight` environment has its App Store Connect key.
  ios:
    name: iOS
    needs: release
    uses: $/.github/workflows/ios-release.yml
    # It lives in the `testflight` environment, which the called job uses.
    secrets:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
    permissions:
      contents: read

  # A nightly build of main, published as a pre-release with no approval. A
  # job of its own, like the release job: it runs no code from the
  # repository, and only it can read the nightly key. That key lives in the
  # `nightly-signing` environment, which takes main only and has no required
  # reviewers:
  #
  #   NIGHTLY_SIGNING_KEY   the secret key file `minisign -G -W` made (no
  #                         password: the environment is what guards it)
  #
  # Its public half is assets/nightly-key.pub. If it leaks, make a new pair,
  # ship the new public key, and delete the nightlies the old one signed:
  # it can only sign nightlies, never a release.
  nightly:
    name: Publish nightly
    needs: [ci, version, linux, windows, macos-notarize]
    if: needs.version.outputs.nightly != ''
    runs-on: depot-ubuntu-24.04
    environment: nightly-signing
    concurrency:
      group: release-nightly
    permissions:
      # Creates the nightly's tag and pre-release, and removes old ones.
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: repo
          sparse-checkout: assets/nightly-key.pub
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: SHA256SUMS
        working-directory: dist
        run: |
          ls -l
          shopt -s nullglob
          archives=(*.tar.gz *.zip *.dmg)
          [ ${#archives[@]} -eq 6 ] || { echo "::error::expected 6 archives, found ${#archives[@]}"; exit 1; }
          sha256sum "${archives[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign

      - name: Sign SHA256SUMS
        working-directory: dist
        env:
          KEY: ${{ secrets.NIGHTLY_SIGNING_KEY }}
          VERSION: ${{ needs.version.outputs.nightly }}
        run: |
          [ -n "$KEY" ] || {
            echo "::error::NIGHTLY_SIGNING_KEY is not set in the nightly-signing environment; see the comment above this job"
            exit 1
          }
          key=$RUNNER_TEMP/nightly.key
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$KEY" > "$key")
          minisign -S -s "$key" -m SHA256SUMS -t "arakun $VERSION SHA256SUMS" < /dev/null
          minisign -V -p "$GITHUB_WORKSPACE/repo/assets/nightly-key.pub" -m SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      # Made as a draft, filled and then published, which immutable releases
      # need; --latest=false keeps it off /releases/latest whatever GitHub
      # decides for pre-releases.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.nightly }}
          LAST: ${{ needs.version.outputs.last-nightly }}
          SHA: ${{ github.sha }}
        run: |
          notes=$RUNNER_TEMP/notes.md
          {
            echo "A nightly build of main at $SHA. Nobody tested it by hand: it can crash, lose a session or change how your data is stored, and a release may not read what it wrote."
            echo
            echo "Installs that follow the nightly channel get it by themselves: \`arakun update --channel nightly\`, or Settings › General › Nightly builds."
            if [ -n "$LAST" ]; then
              echo
              echo "Changes since the last nightly: $GITHUB_SERVER_URL/$GH_REPO/compare/$LAST...$SHA"
            fi
          } > "$notes"
          gh release create "$VERSION" --target "$SHA" --prerelease --latest=false \
            --title "Arakun nightly $VERSION" --notes-file "$notes" \
            dist/*.tar.gz dist/*.zip dist/*.dmg dist/SHA256SUMS dist/SHA256SUMS.minisig

      # The updater only looks at the newest ones. A failure here leaves an
      # old nightly up, which harms nothing, so it does not fail the run.
      - name: Remove old nightlies
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --paginate "repos/$GH_REPO/releases" \
            --jq '.[] | select(.prerelease and (.tag_name | test("^[0-9]+[.][0-9]+[.][0-9]+-nightly[.][0-9]+$"))) | .tag_name' \
            | sort -t. -k4,4n -r | tail -n +15 | while read -r tag; do
              echo "removing $tag"
              gh release delete "$tag" --cleanup-tag --yes || echo "::warning::could not remove $tag"
            done
