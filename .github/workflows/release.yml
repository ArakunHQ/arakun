name: Release

# Builds release binaries for a pushed `v*` tag and publishes them as a GitHub
# Release with SHA256SUMS.
#
# - Linux x86_64 and Windows x86_64 (MSVC) only. macOS is not built yet.
# - Linux builds inside an ubuntu:22.04 container, so the binary needs glibc 2.35
#   or newer (Ubuntu 22.04+, Debian 12+). A runner image links against its own,
#   newer glibc (ubuntu-24.04: 2.39), and the binary then refuses to start on
#   older systems. A step after the build fails if the floor is exceeded.
# - Built with --no-default-features: no `browser` feature, so no CEF in the
#   archives. Browser tabs need a build from source (see README.md).
# - Dependencies resolve exactly as in ci.yml (same Cargo.toml and --locked, no
#   rewriting of the [patch] section), so this builds wherever ci.yml does.
#   CI_CARGO_CONFIG is not used: it only tunes the dev profile.

on:
  push:
    tags: ["v*"]
  # A change to this file builds both archives without publishing (the release
  # job only runs for tags), so a broken release build shows up before a tag.
  pull_request:
    paths: [".github/workflows/release.yml"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Cargo.toml keeps line tables in release builds (debug = 1); the published
  # binaries leave them out, which keeps the archives small and skips the .pdb.
  CARGO_PROFILE_RELEASE_DEBUG: 0

jobs:
  linux:
    name: Build (Linux x86_64)
    runs-on: depot-ubuntu-24.04-8
    # The image's glibc is the binary's floor; see the header. Raising it drops
    # support for older distributions, so update README.md and GLIBC_FLOOR too.
    # Pinned by digest so a moved tag cannot change what the release is built in.
    # To update: look up the current digest of the ubuntu:22.04 tag and replace it.
    container: ubuntu:22.04@sha256:74b12b11ffa550fba1929ad4d8d16533c34f6612728469671afba1b03b66881c
    env:
      GLIBC_FLOOR: "2.35"
    steps:
      # Same libraries as ci.yml (installed directly: cache-apt-pkgs-action expects
      # a runner, not a container), plus what the bare image lacks. Before checkout,
      # which needs git to make a repository rather than a tarball download.
      - name: System packages
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev \
            libfontconfig1-dev libfreetype-dev libvulkan-dev libssl-dev

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      # The key names the image: build scripts cached from a newer one would not
      # run against this glibc.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-linux-ubuntu22.04

      - name: cargo build
        run: cargo build --release --locked --no-default-features --target x86_64-unknown-linux-gnu

      - name: Check glibc floor
        run: |
          bin=target/x86_64-unknown-linux-gnu/release/arakun
          max=$(objdump -T "$bin" | grep -oE 'GLIBC_[0-9.]+' | sed 's/^GLIBC_//' | sort -Vu | tail -1)
          [ -n "$max" ] || { echo "::error::no GLIBC_ symbol versions found in $bin"; exit 1; }
          echo "highest GLIBC_ symbol version: $max (floor $GLIBC_FLOOR)"
          if [ "$(printf '%s\n' "$max" "$GLIBC_FLOOR" | sort -V | tail -1)" != "$GLIBC_FLOOR" ]; then
            echo "::error::arakun needs glibc $max, above the $GLIBC_FLOOR floor"
            objdump -T "$bin" | grep -F "GLIBC_$max"
            exit 1
          fi

      - name: Package
        env:
          # Pull request runs have no tag (ref_name is "<n>/merge").
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: |
          name="arakun-${TAG}-linux-x86_64"
          mkdir -p "dist/$name"
          cp target/x86_64-unknown-linux-gnu/release/arakun "dist/$name/"
          strip "dist/$name/arakun"
          cp LICENSE NOTICE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/*.tar.gz
          if-no-files-found: error

  windows:
    name: Build (Windows x86_64)
    runs-on: depot-windows-2025-8
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows

      # gpui compiles its HLSL shaders with fxc.exe from the Windows SDK in
      # release builds; the runner image ships the SDK (GPUI_FXC_PATH overrides).
      - name: cargo build
        run: cargo build --release --locked --no-default-features --target x86_64-pc-windows-msvc

      - name: Package
        shell: pwsh
        env:
          # Pull request runs have no tag (ref_name is "<n>/merge").
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: |
          $name = "arakun-$env:TAG-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/arakun.exe "dist/$name/"
          Copy-Item LICENSE, NOTICE, README.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          name: Arakun ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
