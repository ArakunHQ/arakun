name: Release

# Builds release binaries for a pushed `v*` tag and publishes them as a GitHub
# Release with SHA256SUMS, its minisign signature and a build provenance
# attestation.
#
# To release: set `version` in Cargo.toml and server/Cargo.toml, merge that,
# then push the tag (`git tag v1.2.3 && git push origin v1.2.3`). Do not create
# the release on GitHub by hand: the publish job makes it as a draft, uploads
# the archives and then publishes it. A release published before that has no
# archives, and with immutable releases on it can no longer take any.
#
# - The version job fails a tag that is not `v` plus the version in
#   Cargo.toml, since `arakun --version` and the crash reports print that
#   version. It also fails when the app and arakun-server versions differ.
# - The CI jobs (ci.yml) run first; the builds wait for them, so a tag on a
#   commit that fails them never publishes. For a tag, every CI job runs. They
#   restore main's cache like any CI run, but nothing they build goes into the
#   archives.
# - A dry run (a pull request that changes this file, or a manual run) builds,
#   smoke-tests and uploads the archives as `arakun-dev-<short sha>-…`, and
#   does not publish. Only a pushed tag publishes; a manual run never does,
#   even on a tag.
# - Linux x86_64, Windows x86_64 (MSVC) and macOS arm64. No Intel Mac build.
# - macOS: Arakun.app made by tools/macos-app.sh, as tools/install.sh makes it,
#   in a disk image made by tools/macos-dmg.py that opens as a branded window
#   with an Applications link to drag it to. The build job signs the app ad-hoc.
#   For a tag or a manual run, the notarize job signs the app inside the image
#   again with the Developer ID certificate, has Apple notarize it and staples
#   the ticket, then does the same for the image, so Gatekeeper opens both
#   however they were downloaded. A pull request's dry run stops at the ad-hoc
#   image: it gets no secrets.
# - Linux builds inside an ubuntu:22.04 container, so the binary needs glibc 2.35
#   or newer (Ubuntu 22.04+, Debian 12+). A runner image links against its own,
#   newer glibc (ubuntu-24.04: 2.39), and the binary then refuses to start on
#   older systems. A step after the build fails if the floor is exceeded.
# - Built with --no-default-features: no `browser` feature, so no CEF in the
#   archives. Browser tabs need a build from source (see README.md).
# - Dependencies resolve exactly as in ci.yml (same Cargo.toml and --locked, no
#   rewriting of the [patch] section), so this builds wherever ci.yml does.
#   CI_CARGO_CONFIG is not used: it only tunes the dev profile.
# - No build cache: every release builds cold, so nothing another run saved can
#   end up in a published binary. Depot Cache does not keep refs apart.
#   The provenance attestation depends on this: it says which workflow and
#   commit built an archive, which only holds if nothing else went into it.

on:
  push:
    tags: ["v*"]
  # Dry runs: a change to this file or to the macOS bundle, image or icon, or a manual
  # run from the Actions tab, builds the archives without publishing, so a
  # broken release build shows up before a tag.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - tools/macos-app.sh
      - tools/macos-dmg.py
      - tools/macos-dmg-requirements.txt
      - tools/Arakun.icon/**
      - assets/brand/dmg-background*.png
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Cargo.toml keeps line tables in release builds (debug = 1); the published
  # binaries leave them out, which keeps the archives small and skips the .pdb.
  CARGO_PROFILE_RELEASE_DEBUG: 0
  # Lets the binaries update themselves (src/update.rs). A build from source
  # never does, since a release would take its browser away.
  ARAKUN_RELEASE_BUILD: "1"

jobs:
  ci:
    name: CI
    uses: $/.github/workflows/ci.yml
    # A called workflow gets at most what its caller job allows; the "What
    # changed" job in ci.yml lists a pull request's files.
    permissions:
      contents: read
      pull-requests: read

  # Runs for dry runs too, so the builds can always need it; only a tag push
  # compares the tag.
  version:
    name: Version
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare the tag and the crate versions
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          read_version() { python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["package"]["version"])' "$1"; }
          app=$(read_version Cargo.toml)
          server=$(read_version server/Cargo.toml)
          echo "Cargo.toml: $app, server/Cargo.toml: $server, tag: ${TAG:-none}"
          if [ "$app" != "$server" ]; then
            echo "::error::Cargo.toml says $app but server/Cargo.toml says $server; they are released together"
            exit 1
          fi
          if [ -n "$TAG" ] && [ "$TAG" != "v$app" ]; then
            echo "::error::tag $TAG does not match version $app in Cargo.toml; set it to ${TAG#v} and tag that commit, or tag v$app"
            exit 1
          fi

  linux:
    name: Build (Linux x86_64)
    needs: [ci, version]
    runs-on: depot-ubuntu-24.04-8
    # The image's glibc is the binary's floor; see the header. Raising it drops
    # support for older distributions, so update README.md and GLIBC_FLOOR too.
    # Pinned by digest so a moved tag cannot change what the release is built in.
    # To update: look up the current digest of the ubuntu:22.04 tag and replace it.
    container: ubuntu:22.04@sha256:74b12b11ffa550fba1929ad4d8d16533c34f6612728469671afba1b03b66881c
    env:
      GLIBC_FLOOR: "2.35"
    steps:
      # Same libraries as ci.yml (installed directly: cache-apt-pkgs-action expects
      # a runner, not a container), plus what the bare image lacks. Before checkout,
      # which needs git to make a repository rather than a tarball download.
      - name: System packages
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev \
            libfontconfig1-dev libfreetype-dev libvulkan-dev libssl-dev

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # CPU and memory use for the weekly runner-sizing report.
      - uses: $/.github/actions/runner-usage

      # The version in rust-toolchain.toml. The bare image has no rustup, so
      # install it first, without a toolchain of its own.
      - name: Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install --no-self-update

      - name: cargo build
        run: cargo build --release --locked --no-default-features --target x86_64-unknown-linux-gnu

      - name: Check glibc floor
        run: |
          bin=target/x86_64-unknown-linux-gnu/release/arakun
          max=$(objdump -T "$bin" | grep -oE 'GLIBC_[0-9.]+' | sed 's/^GLIBC_//' | sort -Vu | tail -1)
          [ -n "$max" ] || { echo "::error::no GLIBC_ symbol versions found in $bin"; exit 1; }
          echo "highest GLIBC_ symbol version: $max (floor $GLIBC_FLOOR)"
          if [ "$(printf '%s\n' "$max" "$GLIBC_FLOOR" | sort -V | tail -1)" != "$GLIBC_FLOOR" ]; then
            echo "::error::arakun needs glibc $max, above the $GLIBC_FLOOR floor"
            objdump -T "$bin" | grep -F "GLIBC_$max"
            exit 1
          fi

      - name: Package
        env:
          # Empty on a dry run; then the name carries the commit (for a pull
          # request its head, not the merge commit GitHub tests).
          TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        # Steps in this container run under sh (dash), not bash: POSIX only.
        run: |
          tag=${TAG:-dev-$(printf %.7s "$SHA")}
          name="arakun-$tag-linux-x86_64"
          mkdir -p "dist/$name"
          cp target/x86_64-unknown-linux-gnu/release/arakun "dist/$name/"
          strip "dist/$name/arakun"
          cp LICENSE NOTICE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      # The archive as a user gets it: unpacks, and the binary loads and runs.
      - name: Smoke test
        run: |
          mkdir smoke
          tar -C smoke -xzf dist/*.tar.gz
          smoke/*/arakun --version

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-x86_64
          path: dist/*.tar.gz
          if-no-files-found: error

  windows:
    name: Build (Windows x86_64)
    needs: [ci, version]
    runs-on: depot-windows-2025-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # CPU and memory use for the weekly runner-sizing report.
      - uses: $/.github/actions/runner-usage

      # The version in rust-toolchain.toml; the build target is the host's.
      - name: Rust toolchain
        run: rustup toolchain install --no-self-update

      # gpui compiles its HLSL shaders with fxc.exe from the Windows SDK in
      # release builds; the runner image ships the SDK (GPUI_FXC_PATH overrides).
      - name: cargo build
        run: cargo build --release --locked --no-default-features --target x86_64-pc-windows-msvc

      - name: Package
        shell: pwsh
        env:
          # Empty on a dry run; then the name carries the commit (for a pull
          # request its head, not the merge commit GitHub tests).
          TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $tag = if ($env:TAG) { $env:TAG } else { "dev-" + $env:SHA.Substring(0, 7) }
          $name = "arakun-$tag-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/arakun.exe "dist/$name/"
          Copy-Item LICENSE, NOTICE, README.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"

      # The archive as a user gets it: unpacks, and the binary loads and runs.
      - name: Smoke test
        shell: pwsh
        run: |
          Expand-Archive -Path (Get-Item dist/*.zip).FullName -DestinationPath smoke
          $exe = (Get-Item smoke/*/arakun.exe).FullName
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "arakun.exe --version exited with $LASTEXITCODE" }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x86_64
          path: dist/*.zip
          if-no-files-found: error

  macos:
    name: Build (macOS arm64)
    needs: [ci, version]
    # On Depot like ci.yml's macOS jobs, but a fixed image rather than
    # depot-macos-latest, so the toolchain does not change under a release. arm64.
    # macOS 26: actool from Xcode 26, which compiles the Liquid Glass icon,
    # crashes on macOS 15 (its asset service needs macOS 26 frameworks).
    # No runner-usage step: it supports only Linux and Windows.
    runs-on: depot-macos-26
    env:
      # The oldest macOS the binary runs on. LSMinimumSystemVersion in
      # Info.plist (tools/macos-app.sh) says the same.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version in rust-toolchain.toml; the build target is the host's.
      - name: Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: cargo build
        run: cargo build --release --locked --no-default-features --target aarch64-apple-darwin

      # For dmgbuild (tools/macos-dmg.py), which needs 3.10 or newer; the
      # system python3 is older. No cache: see the header.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: dmgbuild
        run: |
          python -m venv "$RUNNER_TEMP/dmg"
          "$RUNNER_TEMP/dmg/bin/pip" install --require-hashes --no-deps --only-binary :all: \
            -r tools/macos-dmg-requirements.txt

      - name: Package
        env:
          # Empty on a dry run; then the name carries the commit (for a pull
          # request its head, not the merge commit GitHub tests).
          TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          tag=${TAG:-dev-$(printf %.7s "$SHA")}
          name="arakun-$tag-macos-arm64"
          mkdir -p work dist
          tools/macos-app.sh --strip target/aarch64-apple-darwin/release/arakun work/Arakun.app
          "$RUNNER_TEMP/dmg/bin/python" tools/macos-dmg.py work/Arakun.app "dist/$name.dmg"

      # The image as a user gets it: it mounts with the app, the Applications
      # link and the window layout, the signature holds, and the binary loads
      # and runs.
      - name: Smoke test
        run: |
          mnt=$RUNNER_TEMP/smoke
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mnt" dist/*.dmg
          trap 'hdiutil detach "$mnt"' EXIT
          ls -la "$mnt"
          app=$mnt/Arakun.app
          [ "$(readlink "$mnt/Applications")" = /Applications ]
          test -f "$mnt/.DS_Store"
          test -f "$mnt/.VolumeIcon.icns"
          ls "$mnt"/.background.*
          # Extended attributes on the bundle, which codesign --strict refuses.
          xattr -l "$app"
          codesign --verify --deep --strict "$app"
          test -f "$app/Contents/Resources/Assets.car"
          test -f "$app/Contents/Resources/LICENSE"
          # Which images the icon catalog holds, for each macOS version and appearance.
          echo "::group::Assets.car"; xcrun assetutil --info "$app/Contents/Resources/Assets.car"; echo "::endgroup::"
          "$app/Contents/MacOS/arakun" --version

      # Ad-hoc signed. Where the notarize job runs, it replaces this artifact
      # with the notarized image under the same name, so a run never offers
      # the ad-hoc app next to the signed one.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-arm64
          path: dist/*.dmg
          if-no-files-found: error

  # A job of its own so the signing certificate and the App Store Connect key
  # never reach a job that runs build scripts: this one runs no cargo and no
  # code from the repository. It needs these secrets (repository secrets, or
  # secrets of the `release` environment, which can limit them to v* tags and
  # main):
  #
  #   MACOS_CERTIFICATE           base64 of a .p12 export of the "Developer ID
  #                               Application" certificate with its private key
  #   MACOS_CERTIFICATE_PASSWORD  the password of that .p12
  #   APPLE_API_KEY               the text of the App Store Connect API key
  #                               (AuthKey_<id>.p8), role Developer
  #   APPLE_API_KEY_ID            that key's ID
  #   APPLE_API_ISSUER_ID         the issuer ID shown above the keys list
  macos-notarize:
    name: Notarize (macOS arm64)
    needs: macos
    if: github.event_name != 'pull_request'
    runs-on: depot-macos-15
    environment: release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-arm64
          path: adhoc

      - name: Import the signing certificate
        id: keychain
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          [ -n "$CERTIFICATE" ] && [ -n "$CERTIFICATE_PASSWORD" ] || {
            echo "::error::MACOS_CERTIFICATE and MACOS_CERTIFICATE_PASSWORD are not set; see the comment above this job"
            exit 1
          }
          keychain=$RUNNER_TEMP/signing.keychain-db
          password=$(openssl rand -hex 24)
          printf %s "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          # -x: the private key cannot be exported again, only used by codesign.
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -x
          rm "$RUNNER_TEMP/certificate.p12"
          # Lets codesign use the key without a dialog nobody can click.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          # Added to the search list, which codesign and find-identity read.
          old=()
          while read -r k; do old+=("$(echo "$k" | tr -d '"')"); done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${old[@]}"
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | awk '/"Developer ID Application: / { print $2; exit }')
          [ -n "$identity" ] || {
            echo "::error::the certificate is not a valid Developer ID Application certificate"
            security find-identity -v -p codesigning "$keychain"
            exit 1
          }
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      # The app is signed and stapled inside the image, so the window layout
      # tools/macos-dmg.py made stays as it is and this job needs no code from
      # the repository. The image has free space for the bigger signature and
      # the ticket.
      - name: Open the image
        id: image
        run: |
          rw=$RUNNER_TEMP/rw.dmg
          hdiutil convert adhoc/*.dmg -format UDRW -o "$rw"
          mnt=$RUNNER_TEMP/image
          hdiutil attach -nobrowse -noautoopen -mountpoint "$mnt" "$rw"
          echo "rw=$rw" >> "$GITHUB_OUTPUT"
          echo "mnt=$mnt" >> "$GITHUB_OUTPUT"

      - name: Sign the app
        env:
          IDENTITY: ${{ steps.keychain.outputs.identity }}
          KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
          APP: ${{ steps.image.outputs.mnt }}/Arakun.app
        run: |
          # Hardened runtime, which notarization requires, with no entitlements:
          # the build without the browser needs none (no JIT, no plugins). One
          # binary and no frameworks, so signing the bundle signs everything;
          # a CEF build would have to sign the framework and helpers first.
          # Extended attributes first: codesign --strict refuses a bundle with
          # Finder information on it.
          xattr -cr "$APP"
          codesign --force --timestamp --options runtime \
            --sign "$IDENTITY" --keychain "$KEYCHAIN" "$APP"
          codesign --verify --strict --verbose=2 "$APP"

      # The API key, and notarize(), which submits a file, waits, prints
      # Apple's log and staples the ticket. It runs twice: for the app, so it
      # opens offline once it is copied out of the image, and for the image.
      - name: Notary credentials
        id: notarize
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          [ -n "$API_KEY" ] && [ -n "$API_KEY_ID" ] && [ -n "$API_ISSUER_ID" ] || {
            echo "::error::APPLE_API_KEY, APPLE_API_KEY_ID and APPLE_API_ISSUER_ID are not set; see the comment above this job"
            exit 1
          }
          key=$RUNNER_TEMP/AuthKey.p8
          printf '%s\n' "$API_KEY" > "$key"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          cat > "$RUNNER_TEMP/notarize.sh" <<'EOF'
          # notarize FILE STAPLE: submits FILE and staples the ticket to STAPLE.
          notarize() {
            auth=(--key "$KEY" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID")
            # Goes on after a refusal, to print the log below; the status decides.
            xcrun notarytool submit "$1" "${auth[@]}" \
              --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notary.json" || true
            cat "$RUNNER_TEMP/notary.json"
            id=$(plutil -extract id raw "$RUNNER_TEMP/notary.json")
            status=$(plutil -extract status raw "$RUNNER_TEMP/notary.json")
            # The log says why Apple refused, and lists warnings when it accepts.
            xcrun notarytool log "$id" "${auth[@]}" || true
            [ "$status" = Accepted ] || { echo "::error::notarization of $1 ended with status $status"; exit 1; }
            # The ticket lets Gatekeeper check it offline.
            xcrun stapler staple "$2"
            xcrun stapler validate "$2"
          }
          EOF

      - name: Notarize the app
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          KEY: ${{ steps.notarize.outputs.key }}
          APP: ${{ steps.image.outputs.mnt }}/Arakun.app
        run: |
          . "$RUNNER_TEMP/notarize.sh"
          # notarytool takes a zip, not a bare app; the ticket goes on the app
          # in the image, so this zip is thrown away.
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          notarize "$RUNNER_TEMP/notarize.zip" "$APP"

      - name: Package
        env:
          IDENTITY: ${{ steps.keychain.outputs.identity }}
          KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
          RW: ${{ steps.image.outputs.rw }}
          MNT: ${{ steps.image.outputs.mnt }}
        run: |
          # What macOS leaves on a volume it mounted writable.
          rm -rf "$MNT/.fseventsd" "$MNT/.Trashes"
          # Spotlight can hold the volume for a moment.
          hdiutil detach "$MNT" || { sleep 5; hdiutil detach -force "$MNT"; }
          mkdir dist
          dmg="dist/$(basename adhoc/*.dmg)"
          hdiutil convert "$RW" -format ULFO -o "$dmg"
          # The image's own signature, which Gatekeeper checks on a download.
          codesign --timestamp --sign "$IDENTITY" --keychain "$KEYCHAIN" "$dmg"
          codesign --verify --strict --verbose=2 "$dmg"

      - name: Notarize the image
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          KEY: ${{ steps.notarize.outputs.key }}
        run: |
          . "$RUNNER_TEMP/notarize.sh"
          dmg=$(echo dist/*.dmg)
          notarize "$dmg" "$dmg"

      - name: Remove the API key
        if: always() && steps.notarize.outputs.key != ''
        env:
          KEY: ${{ steps.notarize.outputs.key }}
        run: rm -f "$KEY"

      # Before the smoke test runs the binary: it comes from a job that ran
      # third-party build scripts, and must not find the signing key.
      - name: Remove the keychain
        if: always() && steps.keychain.outputs.keychain != ''
        env:
          KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
        run: security delete-keychain "$KEYCHAIN"

      # The image as a user gets it: Gatekeeper accepts the image and the app
      # in it as notarized (what it checks for a browser download), and the
      # binary loads and runs.
      - name: Smoke test
        run: |
          dmg=$(echo dist/*.dmg)
          # The ticket is stapled to the image itself, not only to the app.
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg" 2>&1 | tee spctl.txt
          grep -q 'source=Notarized Developer ID' spctl.txt
          mnt=$RUNNER_TEMP/smoke
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mnt" "$dmg"
          trap 'hdiutil detach "$mnt"' EXIT
          app=$mnt/Arakun.app
          codesign --verify --deep --strict "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app" 2>&1 | tee spctl.txt
          grep -q 'source=Notarized Developer ID' spctl.txt
          "$app/Contents/MacOS/arakun" --version

      # Replaces the build job's ad-hoc artifact of the same name.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-arm64
          path: dist/*.dmg
          if-no-files-found: error
          overwrite: true

  release:
    name: Publish GitHub Release
    needs: [linux, windows, macos-notarize]
    # Not on a manual run, even one started on a tag: that is a dry run.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: depot-ubuntu-24.04
    # For the release signing key, below.
    environment: release
    permissions:
      contents: write
      # For the provenance attestation. Only this job gets them: it runs no code
      # from the repository, while the build jobs run every build script.
      id-token: write
      attestations: write
    steps:
      # Only the public key, to check the signature against: this job runs no
      # code from the repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: repo
          sparse-checkout: assets/release-key.pub
          sparse-checkout-cone-mode: false

      # macos-arm64 is the notarized image: this job needs macos-notarize,
      # which replaced the build job's ad-hoc artifact.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: SHA256SUMS
        working-directory: dist
        run: |
          ls -l
          shopt -s nullglob
          archives=(*.tar.gz *.zip *.dmg)
          [ ${#archives[@]} -eq 3 ] || { echo "::error::expected 3 archives, found ${#archives[@]}"; exit 1; }
          sha256sum "${archives[@]}" > SHA256SUMS
          cat SHA256SUMS

      # The updater (src/update.rs) refuses a release whose SHA256SUMS this key
      # did not sign, and the install scripts check it where they can. The key
      # lives only in the `release` environment, which takes v* tags and main:
      #
      #   RELEASE_SIGNING_KEY           the secret key file `minisign -G` made
      #   RELEASE_SIGNING_KEY_PASSWORD  its password
      #
      # Its public half is assets/release-key.pub, also in both install
      # scripts. A new key needs a new public key in all three, and a release
      # an old updater can install first: it only trusts the old key.
      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign

      - name: Sign SHA256SUMS
        working-directory: dist
        env:
          KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          PASSWORD: ${{ secrets.RELEASE_SIGNING_KEY_PASSWORD }}
          TAG: ${{ github.ref_name }}
        run: |
          [ -n "$KEY" ] && [ -n "$PASSWORD" ] || {
            echo "::error::RELEASE_SIGNING_KEY and RELEASE_SIGNING_KEY_PASSWORD are not set; see the comment above this step"
            exit 1
          }
          key=$RUNNER_TEMP/release.key
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$KEY" > "$key")
          # minisign reads the password from stdin when it is not a terminal.
          printf '%s\n' "$PASSWORD" | minisign -S -s "$key" -m SHA256SUMS -t "arakun $TAG SHA256SUMS"
          # The public key the binaries carry, so a wrong secret fails here
          # and not in every updater.
          minisign -V -p "$GITHUB_WORKSPACE/repo/assets/release-key.pub" -m SHA256SUMS

      # Signs which workflow run and commit built each archive, so
      # `gh attestation verify <archive> -R arakunhq/arakun` can check a download.
      # Before publishing, so a failure here leaves no unattested release.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      # zizmor would have `gh release create` here. Moving over changes how a
      # re-run treats a release that already exists, which only a real tag can
      # test, so that is its own change.
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4 # zizmor: ignore[superfluous-actions]
        with:
          name: Arakun ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS
            dist/SHA256SUMS.minisig
