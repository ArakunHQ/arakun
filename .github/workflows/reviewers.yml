name: Reviewers

# Requests reviewers once CodeRabbit has finished reviewing a pull request and
# has not approved it. A CodeRabbit approval is enough to merge a routine
# change from the team, so nobody is asked then, unless a review thread is
# still open: the main ruleset requires every thread resolved, and authors
# leave CodeRabbit's threads to a person (CONTRIBUTING.md), so someone has to
# be asked or the pull request sits blocked. Someone is asked as well when
# it changes a critical path, which a maintainer has to approve (see
# human-approval.yml). CodeRabbit's approval is
# dismissed then, and when the author resolved one of its threads, so an
# author can't clear its findings to get approved. Nothing runs this again
# when a thread is resolved, which is why an open thread dismisses it too.
# It replaces CODEOWNERS, so
# the main ruleset no longer has to require a code owner's approval: any
# approval from someone with write access counts.
#
# CodeRabbit may not approve a pull request from outside the team: this
# workflow dismisses such an approval and asks a person. That rule lives here,
# not in .coderabbit.yaml, because CodeRabbit's approval overrides can only
# match members of a team, not everyone outside it.
#
# The dismissal comes after the approval, so it can't stop a merge in
# between. For an outside pull request the "Human approval" commit status
# does; human-approval.yml sets it. For a team pull request whose author
# resolved CodeRabbit's threads, nothing covers those minutes.
#
# Each pull request goes to the person who can check it on their own machine:
# Karlo for Linux and for changes that are not platform specific (Rik if Karlo
# wrote it), Rik for macOS and Dani for Windows. A pull request that touches a
# platform gets that platform's reviewer as well. A pull request from outside
# the team goes to whichever of Karlo and Rik has fewer open review requests,
# to spread the work. Nobody reviews their own pull request. Someone already
# requested, or who has already reviewed, is not asked again, so a push
# doesn't notify everyone again.
#
# A platform counts as touched when a file only that platform uses changes, or
# when a diff hunk mentions it (`cfg(windows)`, `target_os = "macos"`,
# `runs-on: depot-macos-15`...). An edit deep inside a long cfg block, whose cfg line
# is not in the hunk, is missed; request the reviewer by hand then.
#
# When it runs:
# - check_run: CodeRabbit's "CodeRabbit" check run on the head commit
#   completed, so its review is done (or skipped, or rate limited).
# - workflow_run: the "Review submitted" workflow ran, so a review was
#   submitted or dismissed. This catches an approval CodeRabbit gives after
#   its check run, such as once the author resolves its threads, and the
#   approval of an outside pull request. (It used to watch CodeRabbit's
#   summary comment, but CodeRabbit edits that comment many times, and each
#   edit cancelled the run before it.) Reviews this workflow dismisses don't
#   start it again: GitHub starts no workflow for events of its own token.
# - pull_request_target ready_for_review: a draft went ready. CodeRabbit
#   reviews drafts, so its verdict often predates this event; without it the
#   review would finish while the pull request was a draft, this workflow
#   would skip it, and nobody would ever be asked. If CodeRabbit has not
#   finished by now, its own check run starts this workflow when it does.
# - workflow_dispatch: by hand, for a pull request CodeRabbit never reviewed.
#   It doesn't wait for CodeRabbit.
# Drafts get no reviewers, but CodeRabbit does review them.
#
# These events run this file from the default branch with a write token, even
# for pull requests from forks. That is safe only because no job checks out or
# runs code from the pull request: the reviewers are in this file, and the
# changed files and reviews come from the API. Keep it that way. A change to
# this file takes effect once it is on main.

on:
  check_run:
    types: [completed]
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [ready_for_review]
  # Safe as the comment above says; zizmor can't see that no job checks out.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Review submitted]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true

permissions: {}

env:
  # The members of the ArakunHQ/maintainers team. The workflow's token can't
  # read team membership, so keep this in step by hand, here and in
  # human-approval.yml.
  TEAM: KarloAldrete rikvisser-dev daniektj
  # Paths a maintainer has to approve, even after CodeRabbit approved: the
  # "Human approval" status waits for one, so someone has to be asked. Keep
  # in step with human-approval.yml, which explains the patterns.
  CRITICAL: >-
    .github/* AGENTS.md CLAUDE.md CONTRIBUTING.md .claude/* .coderabbit.yaml
    lefthook.yml src/headless* src/control.rs src/account.rs src/fetch.rs
    src/voice.rs src/cloudflare/* src/posthog/* src/github/* src/phone/*
    relay/* phone/* Cargo.toml Cargo.lock deny.toml build.rs
    rust-toolchain.toml tools/setup-dev.* tools/install* src/platform.rs
    src/git.rs src/agent/launch.rs src/agent/rpc.rs src/state.rs
    src/memory.rs src/stored.rs src/durable.rs src/update.rs src/server/*
    src/server.rs

jobs:
  request:
    name: Request reviewers
    # On the job, not the workflow: a run whose job is skipped (any check run
    # but CodeRabbit's) must not cancel one that is working. Keyed by the pull
    # request for every event, so a check_run run and a workflow_run run
    # don't both request the same reviewer at once (GitHub answers one of
    # them with HTTP 422). A run handles the pull request's current head, not
    # the commit its event names, so a late event for an older head that
    # cancels a run does the cancelled run's work. The events list no pull
    # request when the branch is on a fork; the head commit is the key then.
    # A run by hand has a group of its own: it is often for a pull request
    # CodeRabbit never reviewed, and a run started by a review event would
    # cancel it, then stop because CodeRabbit's check run is missing. The
    # steps accept a dismissal or review request the other run already made.
    concurrency:
      group: >-
        reviewers-${{ inputs.pr && format('manual-{0}', inputs.pr) ||
        github.event.check_run.pull_requests[0].number ||
        github.event.workflow_run.pull_requests[0].number ||
        github.event.pull_request.number ||
        github.event.check_run.head_sha || github.event.workflow_run.head_sha ||
        github.event.pull_request.head.sha }}
      cancel-in-progress: true
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_run' ||
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'check_run' &&
      github.event.check_run.app.slug == 'coderabbitai' &&
      github.event.check_run.name == 'CodeRabbit') }}
    runs-on: depot-ubuntu-24.04
    # It waits at most APPROVAL_WAIT per pull request; a hung API call must
    # not hold the runner for the default six hours.
    timeout-minutes: 15
    permissions:
      checks: read
      pull-requests: write
    steps:
      - name: Request reviewers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.event.check_run.head_sha || github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
          PR: >-
            ${{ inputs.pr || github.event.check_run.pull_requests[0].number ||
            github.event.workflow_run.pull_requests[0].number ||
            github.event.pull_request.number }}
          CODERABBIT: coderabbitai[bot]
          # GraphQL names the author of CodeRabbit's threads without "[bot]".
          CODERABBIT_AUTHOR: coderabbitai
          # How long to wait, after CodeRabbit's check run completes, for its
          # approval of a team pull request. It can come about a minute later.
          APPROVAL_WAIT: 120
          # Every pull request: from the team, the first of these who is not
          # the author; from outside, the one with the fewest open requests.
          DEFAULT_REVIEWERS: KarloAldrete rikvisser-dev
          # Per platform: the reviewer, a whole-line regular expression over
          # the changed paths, and one over the lines of the diff.
          WINDOWS_REVIEWER: daniektj
          WINDOWS_PATHS: docs/windows\.md|src/bin/arakun-helper\.manifest|.*\.ps1
          WINDOWS_DIFF: (cfg|cfg_attr|cfg!)\(.*\bwindows\b|target_(os|family) *= *"windows"|runs-on:.*windows
          MACOS_REVIEWER: rikvisser-dev
          MACOS_PATHS: tools/macos-app\.sh|tools/macos-dmg.*|tools/Arakun\.icon/.*|assets/brand/arakun-macos.*|assets/brand/dmg-background.*
          MACOS_DIFF: (cfg|cfg_attr|cfg!)\(.*\bunix\b|target_os *= *"macos"|target_family *= *"unix"|runs-on:.*macos
          LINUX_REVIEWER: KarloAldrete
          LINUX_PATHS: ""
          LINUX_DIFF: (cfg|cfg_attr|cfg!)\(.*\bunix\b|target_os *= *"linux"|target_family *= *"unix"
        run: |
          set -euo pipefail

          # Retries a call that failed on the network or on GitHub's side
          # (a timeout, HTTP 5xx or a rate limit), or took over a minute; any
          # other error fails at once. The output is held until the call succeeds, so a retried
          # --paginate doesn't print a page twice. Every call here can be
          # repeated safely. Keep in step with human-approval.yml.
          gh() {
            local attempt out err rc
            err=$(mktemp)
            for attempt in 1 2 3 4; do
              # timeout runs the gh program, not this function. A call that
              # hangs would otherwise use up the job's whole time limit.
              out=$(timeout 60 gh "$@" 2>"$err") && rc=0 || rc=$?
              if [ "$rc" = 0 ]; then
                rm -f "$err"
                [ -z "$out" ] || printf '%s\n' "$out"
                return 0
              fi
              cat "$err" >&2
              [ "$rc" != 124 ] || echo "gh took more than 60 seconds." >&2
              if [ "$attempt" = 4 ] || { [ "$rc" != 124 ] &&
                ! grep -qiE 'HTTP (5[0-9]{2}|429)|timeout|timed out|connection reset|unexpected EOF|TLS handshake|secondary rate limit|API rate limit exceeded' "$err"; }; then
                rm -f "$err"
                return 1
              fi
              echo "Retrying in $((attempt * 10)) seconds." >&2
              sleep $((attempt * 10))
            done
          }

          in_team() { grep -qxF "$1" <<<"${TEAM// /$'\n'}"; }

          # The first critical path the pull request changes, or nothing.
          # Keep in step with human-approval.yml.
          critical_change() {
            local count files file pat pats
            count=$(gh api "repos/$GH_REPO/pulls/$1" --jq .changed_files) || return 1
            if [ "$count" -gt 3000 ]; then
              echo "more than 3000 files"
              return 0
            fi
            files=$(gh api "repos/$GH_REPO/pulls/$1/files" --paginate \
              --jq '.[] | .filename, (.previous_filename // empty)') || return 1
            read -ra pats <<<"$CRITICAL"
            while IFS= read -r file; do
              for pat in "${pats[@]}"; do
                # shellcheck disable=SC2053 # A pattern on purpose.
                if [[ $file == $pat ]]; then
                  echo "$file"
                  return 0
                fi
              done
            done <<<"$files"
          }

          # CodeRabbit's verdict on the head commit: APPROVED, CHANGES_REQUESTED
          # or nothing. COMMENTED doesn't change a reviewer's verdict on GitHub.
          coderabbit_verdict() {
            gh api "repos/$GH_REPO/pulls/$1/reviews" --paginate --jq \
              '.[] | select(.user.login == env.CODERABBIT and .commit_id == env.HEAD) | .state' |
              grep -xE 'APPROVED|CHANGES_REQUESTED' | tail -n 1 || true
          }

          # One line per review thread that matters here: "open" for an
          # unresolved one, "self" for one of CodeRabbit's the author resolved.
          thread_states() {
            # The $ names are GraphQL variables, not the shell's.
            # shellcheck disable=SC2016
            AUTHOR=$2 gh api graphql --paginate \
              -F owner="${GH_REPO%/*}" -F name="${GH_REPO#*/}" -F pr="$1" \
              -f query='query($owner: String!, $name: String!, $pr: Int!, $endCursor: String) {
                repository(owner: $owner, name: $name) { pullRequest(number: $pr) {
                  reviewThreads(first: 100, after: $endCursor) {
                    nodes { isResolved resolvedBy { login } comments(first: 1) { nodes { author { login } } } }
                    pageInfo { hasNextPage endCursor } } } } }' \
              --jq '.data.repository.pullRequest.reviewThreads.nodes[] |
                if .isResolved | not then "open"
                elif (.comments.nodes[0].author.login // "") == env.CODERABBIT_AUTHOR and
                  .resolvedBy.login == env.AUTHOR then "self"
                else empty end'
          }

          # Every CodeRabbit approval, older commits' too: one of those can
          # still count toward the ruleset.
          coderabbit_approvals() {
            gh api "repos/$GH_REPO/pulls/$1/reviews" --paginate \
              --jq '.[] | select(.user.login == env.CODERABBIT and .state == "APPROVED") | .id'
          }

          # The pull request, the message, then the approvals to dismiss
          # (by default every one there is now).
          dismiss_approvals() {
            local pr=$1 message=$2 id listed
            shift 2
            local ids=("$@")
            if [ ${#ids[@]} -eq 0 ]; then
              # An assignment, not `mapfile < <(...)`: a failed lookup must
              # fail the step, not look like no approvals.
              listed=$(coderabbit_approvals "$pr")
              [ -z "$listed" ] || mapfile -t ids <<<"$listed"
            fi
            for id in "${ids[@]}"; do
              # A retry of a dismissal that went through gets HTTP 422.
              if ! gh api -X PUT "repos/$GH_REPO/pulls/$pr/reviews/$id/dismissals" --silent \
                -f event=DISMISS -f message="$message" &&
                [ "$(gh api "repos/$GH_REPO/pulls/$pr/reviews/$id" --jq .state)" != DISMISSED ]; then
                echo "::error::Couldn't dismiss CodeRabbit's approval $id on #$pr."
                exit 1
              fi
              echo "Dismissed CodeRabbit's approval $id: $message"
            done
          }

          handle() {
            local pr=$1
            echo "::group::#$pr"
            local state draft author
            read -r state draft author HEAD < <(gh api "repos/$GH_REPO/pulls/$pr" \
              --jq '[.state, .draft, .user.login, .head.sha] | @tsv')
            export HEAD
            if [ "$state" != open ] || [ "$draft" = true ]; then
              echo "It is closed or a draft."
              echo "::endgroup::"
              return
            fi

            if [ "$EVENT" != workflow_dispatch ]; then
              local check status completed
              check=$(gh api "repos/$GH_REPO/commits/$HEAD/check-runs?check_name=CodeRabbit" \
                --jq '[.check_runs[] | select(.app.slug == "coderabbitai")][0] // {} | [.status // "missing", .completed_at // ""] | @tsv')
              read -r status completed <<<"$check"
              if [ "$status" != completed ]; then
                echo "CodeRabbit hasn't finished reviewing $HEAD ($status)."
                echo "::endgroup::"
                return
              fi
              # CodeRabbit can approve a little after its check run ends. An
              # outside pull request needn't wait: its approval is dismissed.
              if in_team "$author"; then
                local deadline
                deadline=$(($(date -d "$completed" +%s) + APPROVAL_WAIT))
                while [ -z "$(coderabbit_verdict "$pr")" ] && [ "$(date +%s)" -lt "$deadline" ]; do
                  sleep 15
                done
              fi
            fi

            if ! in_team "$author"; then
              dismiss_approvals "$pr" \
                "A pull request from outside the team needs a person's approval. CodeRabbit's comments still apply."
            fi
            # Any approval, not only the head's: a newer head may get no
            # verdict at all (CodeRabbit rate limited), and an older approval
            # can still count. Taken before the threads are read, so only
            # these are dismissed: an approval that comes later starts a run
            # of its own, which judges it.
            local approvals=() listed
            if in_team "$author"; then
              # A failed lookup fails the step (see dismiss_approvals).
              listed=$(coderabbit_approvals "$pr")
              [ -z "$listed" ] || mapfile -t approvals <<<"$listed"
            fi
            if [ ${#approvals[@]} -gt 0 ]; then
              local threads open self
              threads=$(thread_states "$pr" "$author")
              open=$(grep -cx open <<<"$threads" || true)
              self=$(grep -cx self <<<"$threads" || true)
              # Open threads dismiss it too: nothing runs this again when a
              # thread is resolved, so the author could resolve them
              # afterwards and merge on CodeRabbit's approval.
              if [ "$self" -gt 0 ]; then
                dismiss_approvals "$pr" \
                  "The author resolved CodeRabbit's threads, so a person has to approve. CodeRabbit's comments still apply." \
                  "${approvals[@]}"
              elif [ "$open" -gt 0 ]; then
                echo "$open review threads are open."
                dismiss_approvals "$pr" \
                  "Review threads are still open; a person resolves them and approves. CodeRabbit's comments still apply." \
                  "${approvals[@]}"
              elif [ "$(coderabbit_verdict "$pr")" = APPROVED ]; then
                local critical
                # A failed lookup fails the step (see dismiss_approvals).
                critical=$(critical_change "$pr")
                if [ -z "$critical" ]; then
                  echo "CodeRabbit approved $HEAD and every thread is resolved; no reviewer needed."
                  echo "::endgroup::"
                  return
                fi
                echo "CodeRabbit approved $HEAD, but it changes $critical, so a maintainer approves too."
              else
                # Only an older commit's approval: it would still count.
                dismiss_approvals "$pr" \
                  "CodeRabbit has not approved the latest commit, so a person has to approve. CodeRabbit's comments still apply." \
                  "${approvals[@]}"
              fi
            fi

            # Old paths too, so moving a platform's file away still counts.
            local paths diff requested reviewed asked
            paths=$(gh api "repos/$GH_REPO/pulls/$pr/files" --paginate \
              --jq '.[] | .filename, (.previous_filename // empty)')
            # GitHub leaves the patch out for very large files.
            diff=$(gh api "repos/$GH_REPO/pulls/$pr/files" --paginate --jq '.[].patch // empty')

            requested=$(gh api "repos/$GH_REPO/pulls/$pr/requested_reviewers" --jq '.users[].login')
            reviewed=$(gh api "repos/$GH_REPO/pulls/$pr/reviews" --paginate --jq '.[].user.login')
            asked="$requested"$'\n'"$reviewed"

            local want=() user
            if in_team "$author"; then
              for user in $DEFAULT_REVIEWERS; do
                if [ "$user" != "$author" ]; then
                  want+=("$user")
                  break
                fi
              done
            else
              # Pick once: on a later push the load has changed, and picking
              # again would ask a second person.
              local picked="" fewest="" load
              for user in $DEFAULT_REVIEWERS; do
                if grep -qxF "$user" <<<"$asked"; then
                  picked=$user
                fi
              done
              if [ -z "$picked" ]; then
                for user in $DEFAULT_REVIEWERS; do
                  load=$(gh api -X GET search/issues --jq .total_count \
                    -f q="repo:$GH_REPO is:pr is:open review-requested:$user")
                  echo "$user has $load open review requests."
                  if [ -z "$fewest" ] || [ "$load" -lt "$fewest" ]; then
                    fewest=$load
                    picked=$user
                  fi
                done
                want+=("$picked")
              fi
            fi
            local platform reviewer_var paths_var diff_var
            for platform in WINDOWS MACOS LINUX; do
              reviewer_var="${platform}_REVIEWER" paths_var="${platform}_PATHS" diff_var="${platform}_DIFF"
              if { [ -n "${!paths_var}" ] && grep -qxE "${!paths_var}" <<<"$paths"; } ||
                grep -qE "${!diff_var}" <<<"$diff"; then
                echo "Touches ${platform,,}."
                want+=("${!reviewer_var}")
              fi
            done

            local add=()
            for user in "${want[@]}"; do
              if [ "$user" = "$author" ] ||
                grep -qxF "$user" <<<"$asked"$'\n'"$(printf '%s\n' "${add[@]}")"; then
                continue
              fi
              add+=("$user")
            done

            if [ ${#add[@]} -eq 0 ]; then
              echo "Everyone who should review is already asked."
            elif [ "$(gh api "repos/$GH_REPO/pulls/$pr" --jq .head.sha)" != "$HEAD" ]; then
              # A push during the wait: the new commit's review decides.
              echo "The head moved on from $HEAD; its own review will run this again."
            else
              local args=()
              for user in "${add[@]}"; do
                args+=(-f "reviewers[]=$user")
              done
              if gh api -X POST "repos/$GH_REPO/pulls/$pr/requested_reviewers" "${args[@]}" --silent; then
                echo "Requested: ${add[*]}"
              else
                # Another run may have asked them a moment before (HTTP 422).
                # That is fine as long as everyone is asked, or has reviewed,
                # now.
                requested=$(gh api "repos/$GH_REPO/pulls/$pr/requested_reviewers" --jq '.users[].login')
                reviewed=$(gh api "repos/$GH_REPO/pulls/$pr/reviews" --paginate --jq '.[].user.login')
                for user in "${add[@]}"; do
                  if ! grep -qxF "$user" <<<"$requested"$'\n'"$reviewed"; then
                    echo "::error::Couldn't request $user's review on #$pr."
                    exit 1
                  fi
                done
                echo "Already requested: ${add[*]}"
              fi
            fi
            echo "::endgroup::"
          }

          PR=${PR// /}
          if [ -n "$PR" ] || [ "$EVENT" = workflow_dispatch ]; then
            if ! [[ "$PR" =~ ^[0-9]+$ ]]; then
              echo "::error::Not a pull request number: $PR"
              exit 1
            fi
          fi
          prs=$PR
          if [ "$EVENT" != workflow_dispatch ]; then
            # The event lists only one pull request, and none when the branch
            # is on a fork, so find them by their head commit too.
            found=$(gh api "repos/$GH_REPO/pulls?state=open&per_page=100" --paginate \
              --jq '.[] | select(.head.sha == env.SHA) | .number')
            prs=$(printf '%s\n' "$prs" "$found" | sed '/^$/d' | sort -un)
          fi
          for pr in $prs; do
            handle "$pr"
          done
