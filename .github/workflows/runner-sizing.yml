name: Runner sizing

# Every Monday: are the CI and release runners the right size? Reads the CPU
# and memory use that .github/actions/runner-usage reports for each job over
# the past week and estimates, per job, what a runner with half or double the
# CPUs would do to its time and cost. The report is the run's summary page and
# the runner-sizing artifact (raw numbers). See .github/scripts/runner-sizing.mjs.
#
# When a job's runner should change (downsize, upsize or memory-bound), the
# report also goes into an issue titled "Runner sizing: changes suggested":
# opened if none is open, otherwise updated with a comment each week. A week
# with nothing to change closes it.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      days:
        description: Days to look back
        default: "7"
      update_issue:
        description: Open, update or close the runner sizing issue
        type: boolean
        default: true

permissions:
  actions: read # workflow runs and jobs
  checks: read # the jobs' annotations
  contents: read
  issues: write # the runner sizing issue

jobs:
  report:
    name: Report
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Analyze the past week's jobs
        id: analyze
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DAYS: ${{ inputs.days || '7' }}
          OUT_JSON: runner-sizing.json
          OUT_MD: runner-sizing.md
        run: node .github/scripts/runner-sizing.mjs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runner-sizing
          path: runner-sizing.json
          if-no-files-found: error

      # One open issue at a time, found by its exact title.
      - name: Open, update or close the issue
        if: github.event_name == 'schedule' || inputs.update_issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHANGES: ${{ steps.analyze.outputs.changes }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Runner sizing: changes suggested"
          number=$(gh issue list --state open --limit 200 --json number,title \
            --jq "map(select(.title == \"$title\")) | first | .number // empty")

          if [ "${CHANGES:-0}" -gt 0 ]; then
            {
              echo "The weekly runner sizing report suggests changing the runner of $CHANGES job(s). See the verdicts below; to change one, edit its \`runs-on\` in \`.github/workflows/\`."
              echo
              echo "Updated by [this run]($RUN_URL)."
              echo
              cat runner-sizing.md
            } > issue.md
            if [ -z "$number" ]; then
              gh issue create --title "$title" --body-file issue.md
            else
              gh issue edit "$number" --body-file issue.md
              gh issue comment "$number" --body "Updated for the past week: $CHANGES job(s) with a suggested change ([run]($RUN_URL)). The description has the new report."
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "This week no runner needs a change ([run]($RUN_URL)), so I'm closing this."
          else
            echo "No changes suggested and no open issue."
          fi
