name: Rust stable

# Every Monday: does clippy still pass on the latest stable Rust? CI builds with
# the version in rust-toolchain.toml, so a new release cannot fail pull requests
# on code they did not touch. This job tells when the next bump needs work.
#
# On failure, an issue titled "CI: clippy fails on the latest stable Rust" is
# opened, or commented on if one is open. To fix it, bump the channel in
# rust-toolchain.toml and fix the new lints in the same pull request. A week
# where clippy passes closes the issue.

on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:
    inputs:
      update_issue:
        description: Open, update or close the Rust stable issue
        type: boolean
        default: true

permissions:
  contents: read
  issues: write # the Rust stable issue

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  clippy:
    name: Clippy on latest stable
    runs-on: depot-ubuntu-24.04-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: GPUI system libraries
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev libfontconfig1-dev libfreetype-dev libvulkan-dev libssl-dev
          version: 1

      # `+stable` below overrides rust-toolchain.toml. No build cache: a new
      # compiler version would miss it anyway.
      - name: Latest stable Rust
        id: toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy --no-self-update
          echo "version=$(rustc +stable --version)" >> "$GITHUB_OUTPUT"

      # Same command as the clippy job in ci.yml, with dependencies unoptimized.
      - name: cargo clippy
        id: clippy
        continue-on-error: true
        run: cargo +stable clippy --locked --all-targets --no-default-features --config 'profile.dev.package."*".opt-level=0' -- -D warnings

      # One open issue at a time, found by its exact title.
      - name: Open, update or close the issue
        if: github.event_name == 'schedule' || inputs.update_issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OUTCOME: ${{ steps.clippy.outcome }}
          VERSION: ${{ steps.toolchain.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="CI: clippy fails on the latest stable Rust"
          pinned=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          number=$(gh issue list --state open --limit 200 --json number,title \
            --jq "map(select(.title == \"$title\")) | first | .number // empty")

          if [ "$OUTCOME" != success ]; then
            if [ -z "$number" ]; then
              {
                echo "\`cargo clippy\` fails on the latest stable Rust ($VERSION). CI still builds with $pinned from \`rust-toolchain.toml\`, so pull requests are not affected."
                echo
                echo "To fix it, bump \`channel\` in \`rust-toolchain.toml\` and fix the new warnings and lints in the same pull request. The errors are in [this run]($RUN_URL)."
              } > issue.md
              gh issue create --title "$title" --body-file issue.md --label "area: ci"
            else
              gh issue comment "$number" --body "Still failing on $VERSION ([run]($RUN_URL))."
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "Clippy passes on $VERSION ([run]($RUN_URL)), so I'm closing this."
          else
            echo "Clippy passes on $VERSION and no issue is open."
          fi

      # The run shows red while clippy fails, even with the issue up to date.
      - name: Fail if clippy failed
        if: steps.clippy.outcome != 'success'
        run: exit 1
