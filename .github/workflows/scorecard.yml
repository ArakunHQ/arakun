name: Scorecard

# OpenSSF Scorecard rates the repository's supply-chain practices: branch
# protection, pinned actions, token permissions, signed releases, fuzzing and
# more. Each check below its best score is an alert in the Security tab, with
# what to change. The results are also published to the OpenSSF API, which
# feeds the badge and deps.dev.
#
# Publishing has rules of its own: the job may use only a short list of actions
# (so not the runner-usage action the other jobs use), no run steps, no
# top-level env, and a GitHub-hosted runner. Scorecard checks them and refuses
# the upload otherwise.

on:
  push:
    branches: [main]
  # Branch protection changes in Settings don't push a commit, so main is
  # also scored weekly.
  schedule:
    - cron: "51 5 * * 3"
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: Scorecard
    # Publishing requires a GitHub-hosted runner, not a Depot one.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # read the workflow runs, for the CI-Tests check
      security-events: write # upload the results
      id-token: write # sign the results it publishes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      # Pinned: this job can write security results.
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
          category: scorecard
