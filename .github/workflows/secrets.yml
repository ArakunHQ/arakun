name: Secrets

# TruffleHog looks for credentials in the commits: API keys, tokens, private
# keys and connection strings. GitHub's own secret scanning only knows the
# token formats of its partners and runs after the push; this runs on the pull
# request, before the commit reaches main.
#
# The commit scan fails only on a secret TruffleHog verified as live, by trying
# it against the service. Test fixtures such as the redaction tests' fake
# connection strings can't be verified, so they don't fail it. A live secret
# has to be revoked, not only removed: it stays in the history.
#
# A pull request's new files are also scanned for secrets TruffleHog could not
# verify: a new file is where a pasted .env or key file ends up, and the commit
# scan would let it through when the service is down or unknown. Old files are
# left out, so a fixture that is already there doesn't fail every pull request
# that touches it. A fake secret in a new file ends its line with a
# `trufflehog:ignore` comment.
#
# Pull requests and pushes scan only their new commits. The weekly run scans
# the whole history, as a secret that failed to verify last week (a service
# that was down) may verify now. The TruffleHog job is a required check in
# main's ruleset, so it runs on every pull request, with no path filter.
# lefthook.yml runs gitleaks on staged files before a commit, to catch it
# sooner.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 4 * * 1"
  workflow_dispatch:

permissions: {}

# A pull request's runs share a group, so a new push cancels the old run. Other
# runs (pushes to main, schedules) get a group per commit, as in deny.yml.
concurrency:
  group: secrets-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
    steps:
      # The whole history: the action scans from the pull request's base or
      # the push's previous head, and those commits must be here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A fixed CLI version (the action defaults to latest), so a new release's
      # detectors don't fail pull requests that changed nothing; bump it with
      # the action.
      - uses: trufflesecurity/trufflehog@3bd2b5887eb0efb8fa18bfd1d296032924e4ffdc # v3.99.9
        with:
          version: 3.99.9
          extra_args: --results=verified

      # Every result, verified or not, in the files the pull request adds. On
      # a pull request the checkout is the merge commit, so its diff against
      # the base is the pull request's own change. Same image and version as
      # the step above.
      - name: Unverified secrets in added files
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          TRUFFLEHOG: ghcr.io/trufflesecurity/trufflehog:3.99.9
        run: |
          git diff --name-only --diff-filter=A -z "$BASE" HEAD > "$RUNNER_TEMP/added"
          if [ ! -s "$RUNNER_TEMP/added" ]; then
            echo "No files added"
            exit 0
          fi
          xargs -0 docker run --rm -v "$PWD:/repo:ro" -w /repo "$TRUFFLEHOG" \
            filesystem --fail --no-update --github-actions \
            --results=verified,unverified,unknown -- < "$RUNNER_TEMP/added"
