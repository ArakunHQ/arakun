[package]
name = "arakun"
version = "0.23.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"
# src/bin/arakun-helper.rs is CEF's child process on Windows
default-run = "arakun"

[dependencies]
# The code the app shares with `arakun-server` and the examples (core/).
arakun-core = { path = "core" }
gpui.workspace = true
gpui_platform = { workspace = true, features = ["font-kit", "wayland", "x11"] }
anyhow.workspace = true
image.workspace = true
# `arakun dev` screenshots its virtual X display (src/dev.rs); screensaver: idle time on X11 (src/idle.rs)
x11rb = { version = "0.14", features = ["screensaver"] }
# projects, environments, explorer
serde.workspace = true
serde_json.workspace = true
# Cloudflare's API: one client that keeps its connections (src/cloudflare).
ureq.workspace = true
ignore.workspace = true
unicode-segmentation.workspace = true
futures.workspace = true
pulldown-cmark.workspace = true
base64.workspace = true
# UI zoom wraps gpui's platform window (src/ui_zoom.rs); these name types in its traits
raw-window-handle.workspace = true
smallvec = "1"
# the Isometric tab rasterizes its frames with exact coverage (src/iso/raster.rs); gpui already pulls it in
tiny-skia = "0.12"
# Isometric scenes are scripts (src/iso/script.rs): sandboxed, pure Rust, f32 like the engine
rhai = { version = "1", features = ["f32_float"] }
# glyph outlines for labels in isometric scenes (src/iso/text.rs); gpui already pulls it in
ttf-parser = "0.25"
# the Canvas tab (src/canvas): Doop's HTML frames rendered natively, without a browser
# (private crate: only the `coderlabs` build has it)
# its renders run on a pool of their own, below the UI thread (gpui already pulls it in)
rayon = "1"
# spreadsheets shown in file tabs (src/sheet.rs): xlsx, xls, xlsb and ods, pure Rust
calamine = { version = "0.38", features = ["dates"] }
tungstenite.workspace = true
qrcode.workspace = true
getrandom.workspace = true
sha2.workspace = true
# crash reports' stack traces (src/telemetry.rs); gpui already pulls it in
backtrace = "0.3"
ring.workspace = true
# Teams (src/arakun_teams/crypto.rs): ECDH with the device's long-lived key,
# which ring only does with keys it makes and drops at once; everything else
# stays with ring.
p256 = { version = "0.14", default-features = false, features = ["ecdh"] }
# the signature of a release's SHA256SUMS (src/update.rs); no dependencies of its own
minisign-verify = "0.3"
rusqlite = { version = "=0.43.0", default-features = false, features = ["bundled"] }
# the processes behind the local servers that run (src/running.rs): parent, command line,
# folder, memory and start; zed-scap already pulls it in
sysinfo = { version = "0.31.4", default-features = false, features = ["system"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Idle time on Wayland, from the desktop over the session bus (src/idle.rs). gpui
# already pulls it in through ashpd; keep it at that version.
zbus = "=5.19.0"

[target.'cfg(any(target_os = "linux", target_os = "macos", windows))'.dependencies]
# arakun-helper (src/bin) is CEF's child process on Windows. The browser tabs are in
# core/src/browser; see the `browser` feature of core/Cargo.toml.
cef = { workspace = true, optional = true }
# Only for build.rs, which reads where CEF is (DEP_CEF_DLL_WRAPPER_CEF_DIR) and copies its
# runtime next to arakun.exe on Windows. Keep it at the version `cef` uses.
cef-dll-sys = { version = "=156.3.0", default-features = false, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# Metal shaders compiled when the window opens: precompiling them needs the full Xcode
# (`xcrun metal`), and the Command Line Tools alone are enough to build this way.
# window-capture: `arakun dev shot` has the test arakun render its own frame
# (src/dev.rs), so it needs no Screen Recording permission.
gpui_platform = { workspace = true, features = ["runtime_shaders", "window-capture"] }

[target.'cfg(windows)'.dependencies]
# `arakun <command>`: Windows 10+ has AF_UNIX sockets; std only exposes them on Unix.
uds_windows.workspace = true
# gpui's PlatformWindow::get_raw_handle returns this HWND (src/ui_zoom.rs)
windows = { version = "0.62", features = ["Win32_Foundation"] }
windows-sys.workspace = true

[build-dependencies]
# the Windows app icon in arakun.exe (build.rs); gpui already pulls it in
embed-resource = "3"

[[bin]]
name = "arakun-helper"
required-features = ["browser"]

# core/ (`arakun-core`) is the code the app shares with `arakun-server` and the
# examples. `arakun-server` is the server (core/src/server.rs) for a machine with no
# display. A package of its own, because it takes GPUI without Wayland and X11, and
# features are per package. Cargo commands run here leave it out; name it with
# `-p arakun-server` (see server/Cargo.toml).
[workspace]
members = ["core", "server"]
default-members = [".", "core"]

# What more than one package depends on, written once so all resolve to the same
# crate in Cargo.lock.
[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "526c95d474b2bf800e95aab30222fa0341f08e19" }
# No `wayland`, no `x11`, no `font-kit` here: what is left is GPUI's headless
# platform, which is all `arakun-server` takes. The app adds the rest.
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "526c95d474b2bf800e95aab30222fa0341f08e19" }
anyhow = "1"
image = { version = "0.25.1", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
ignore = "0.4"
unicode-segmentation = "1"
# gpui already pulls it in
regex = "1"
futures = "0.3"
pulldown-cmark = { version = "0.13", default-features = false }
base64 = "0.23"
raw-window-handle = "0.6"
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
qrcode = { version = "0.14.1", default-features = false }
getrandom = "0.4"
sha2 = "0.11"
ring = "0.17"
libc = "0.2"
cef = { version = "=156.3.0", default-features = false }
uds_windows = "1.2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    # What listens on a TCP port, and its pid (src/running.rs)
    "Win32_NetworkManagement_IpHelper",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Time",
    # Idle time: GetLastInputInfo against GetTickCount64 (src/idle.rs)
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
    # High contrast (core/src/ui/contrast.rs)
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
default = ["browser"]
browser = ["dep:cef", "dep:cef-dll-sys", "arakun-core/browser"]
# The private team hub (src/team*, src/team_view*, src/shell/team.rs). Not in the public build.
team = []
# CoderLabs/owner-only parts (Lab, site analytics, X log, CoderSpace tasks, OKC, voice call,
# meeting recorder, the borrowed Claude seat, the Canvas tab). Not in the public build.
coderlabs = ["arakun-core/coderlabs"]

# Thin LTO and one codegen unit let the compiler inline across crates (GPUI, the
# terminal, the parsers), which the app's hot paths cross every frame. Release builds
# take longer for it; the dev profile is untouched.
[profile.release]
debug = 1
lto = "thin"
codegen-units = 1

# What tools/install.sh builds by default: the release profile without its slowest
# parts. One codegen unit and LTO keep one core busy for minutes on every change to
# the app crate; this profile splits the work and keeps incremental state, so
# rebuilding after an edit takes seconds instead of about six minutes on a 24-thread
# machine. The binary is somewhat larger and slower than a release's. Releases and CI
# keep `--release`.
[profile.release-local]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

# Leaves debug info in the object files instead of copying it into each binary. A
# change relinks the app, its tests and the examples: on Linux this cut an incremental
# `cargo test` build from about 55 s to 7 s. macOS does this by default. Cargo leaves
# it out on targets without it (Windows MSVC).
[profile.dev]
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2

# Patched GPUI (src/browser: a browser frame updated in place in the sprite atlas, and
# Chromium's DMA-BUF frames copied into it on the GPU) and wgpu-hal (enables
# VK_EXT_image_drm_format_modifier to import those frames).
[patch."https://github.com/zed-industries/zed"]
collections = { git = "https://github.com/arakunhq/zed", rev = "958d408919396444e17d7ce78ce02c318a4ac44e" }
derive_refineable = { git = "https://github.com/arakunhq/zed", rev = "958d408919396444e17d7ce78ce02c318a4ac44e" }
gpui = { git = "https://github.com/arakunhq/zed", rev = "958d408919396444e17d7ce78ce02c318a4ac44e", version = "=0.2.2" }
gpui_apple = { git = "https://github.com/arakunhq/zed", rev = "958d408919396444e17d7ce78ce02c318a4ac44e" }
gpui_linux = { git = "https://github.com/arakunhq/zed", rev = "958d408919396444e17d7ce78ce02c318a4ac44e" }
gpui_macos = { git = "https://github.com/arakunhq/zed", rev = "958d408919396444e17d7ce78ce02c318a4ac44e" }
gpui_macros = { git = "https://github.com/arakunhq/zed", rev = "958d408919396444e17d7ce78ce02c318a4ac44e" }
gpui_platform = { git = "https://github.com/arakunhq/zed", rev = "958d408919396444e17d7ce78ce02c318a4ac44e" }
gpui_shared_string = { git = "https://github.com/arakunhq/zed", rev = "958d408919396444e17d7ce78ce02c318a4ac44e", version = "=0.1.0" }
gpui_util = { git = "https://github.com/arakunhq/zed", rev = "958d408919396444e17d7ce78ce02c318a4ac44e" }
gpui_web = { git = "https://github.com/arakunhq/zed", rev = "958d408919396444e17d7ce78ce02c318a4ac44e" }
gpui_wgpu = { git = "https://github.com/arakunhq/zed", rev = "958d408919396444e17d7ce78ce02c318a4ac44e" }
gpui_windows = { git = "https://github.com/arakunhq/zed", rev = "958d408919396444e17d7ce78ce02c318a4ac44e" }
http_client = { git = "https://github.com/arakunhq/zed", rev = "958d408919396444e17d7ce78ce02c318a4ac44e" }
refineable = { git = "https://github.com/arakunhq/zed", rev = "958d408919396444e17d7ce78ce02c318a4ac44e" }
scheduler = { git = "https://github.com/arakunhq/zed", rev = "958d408919396444e17d7ce78ce02c318a4ac44e" }
sum_tree = { git = "https://github.com/arakunhq/zed", rev = "958d408919396444e17d7ce78ce02c318a4ac44e" }
ztracing = { git = "https://github.com/arakunhq/zed", rev = "958d408919396444e17d7ce78ce02c318a4ac44e" }
ztracing_macro = { git = "https://github.com/arakunhq/zed", rev = "958d408919396444e17d7ce78ce02c318a4ac44e" }

