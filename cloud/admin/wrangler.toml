# Arakun's operator panel, a second Worker behind Cloudflare Access: it checks
# the operator's Access token, forwards /api/* to the cloud Worker over the
# CLOUD service binding, and serves the React page that vite builds into
# dist/client.
# The top-level Worker is for tests; production is `--env production` below.
name = "arakun-admin-dev"
main = "worker/index.ts"
compatibility_date = "2026-11-01"

# The page is a single-page app: any path that is not a file gets index.html.
# The Worker runs first for every request: it puts the page policy on each
# page, and a path list would let the assets answer without it. The Worker
# asks env.ASSETS, which still falls back to index.html.
[assets]
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# The cloud Worker keeps the database and the /admin/* routes. The browser
# never reaches it: this Worker adds the bearer secret.
[[services]]
binding = "CLOUD"
service = "arakun-cloud-dev"

# ADMIN_SECRET is a Worker secret. Access is not set up for the test Worker, so
# its ACCESS_TEAM_DOMAIN and ACCESS_AUD stay unset: nobody gets in, except
# DEV_OPERATOR_EMAIL from .dev.vars on localhost (worker/access.ts).
[vars]
CLOUD_ORIGIN = "http://localhost:8787"

# The hosted Worker (`npm run deploy`). An environment inherits no bindings, so
# they are all here again.
# The cloud Worker's route is `*.arakun.dev/*`, which also matches
# admin.arakun.dev. The more specific pattern wins, so this one takes the host:
# https://developers.cloudflare.com/workers/configuration/routing/routes/
# ("When more than one route pattern could match a request URL, the most
# specific route pattern wins.")
[env.production]
name = "arakun-admin"
workers_dev = false
routes = [{ pattern = "admin.arakun.dev/*", zone_name = "arakun.dev" }]

[env.production.assets]
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[env.production.services]]
binding = "CLOUD"
service = "arakun-cloud"

# The Cloudflare Access application in front of admin.arakun.dev: the team
# domain and the application's Audience (AUD) tag, from Zero Trust, Access,
# Applications, the application's Overview. Neither is a secret. The Worker
# checks every request's Access token against both. cloud-deploy.yml skips this
# Worker while ACCESS_AUD is PLACEHOLDER, which a copy without Access of its own
# keeps.
[env.production.vars]
CLOUD_ORIGIN = "https://app.arakun.dev"
ACCESS_TEAM_DOMAIN = "PLACEHOLDER"
ACCESS_AUD = "PLACEHOLDER"
