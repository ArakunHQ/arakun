# Arakun's cloud, one Worker: the relay phones reach a computer through (one
# Durable Object per computer, the phone page served as static assets), and
# the teams API (sign-in with GitHub, per-user feature flags and the teams of
# PROTOCOL.md, with a D1 database and one Durable Object per channel). A host
# `<label>.<BASE_DOMAIN>` is an old relay host and only tells old apps to
# update; every other host is the account host.
# The top-level Worker is for tests; production is `--env production` below.
# Their names differ so a test deploy cannot replace production's bindings.
name = "arakun-cloud-dev"
main = "src/index.ts"
# On or after 2026-04-07, so the runtime answers a WebSocket client's close by
# itself (src/channel.ts relies on it).
compatibility_date = "2026-11-01"

# The tests and `wrangler dev` run without the cloud machine's container: it
# would need Docker and an image build on every run. `ctx.container` is then
# unset: machines can be made, and a wake answers 503.
# `wrangler dev --enable-containers` builds it and runs it locally.
[dev]
enable_containers = false

# The phone page, as built into phone/dist (`npm run build` in phone/ writes
# it, and it is committed): the Worker runs first and hands the rest to the
# assets.
[assets]
directory = "../phone/dist"
binding = "ASSETS"
run_worker_first = true

# Global switches and per-plan limits of the relay; `wrangler kv namespace
# create CONFIG` gives the id to put here.
[[kv_namespaces]]
binding = "CONFIG"
id = "00000000000000000000000000000000"

# Users, sessions, flags, devices, teams, invites, envelopes and channels.
# This Worker has a database of its own, so a test deploy and its admin secret
# never reach production's data. `wrangler d1 create arakun-cloud-dev` gives the
# id to put here; `wrangler d1 migrations apply` reads the tables from migrations/.
[[d1_databases]]
binding = "DB"
database_name = "arakun-cloud-dev"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# The GitHub OAuth App "Arakun" (ArakunHQ). The desktop app runs the device
# flow with this public ID and no secret; the Worker asks GitHub whether that
# app issued a token with `wrangler secret put GITHUB_CLIENT_SECRET`.
[vars]
GITHUB_CLIENT_ID = "Ov23lipgmMeATCa5aTr3"
# The old relay hosts are `<label>.<BASE_DOMAIN>`.
BASE_DOMAIN = "arakun.dev"
# Who Apple delivers the iOS app's notices for (src/push.ts). The key itself
# is `wrangler secret put APNS_KEY` and `APNS_KEY_ID`.
APNS_TEAM_ID = "V9JGU28UV7"
APNS_TOPIC = "com.arakun.ios"

# Sign-in calls GitHub and writes to D1, so each client IP gets a few a minute.
# Rate limits with the same namespace_id in one account share their counters,
# so every id here is used once: this Worker has 1003, 1004, 1005, 1007,
# 1011, 1013, 1015 and 1017, production 1001, 1002, 1006, 1008, 1012, 1014,
# 1016 and 1018. cloud/admin has 1009, 1010, 1019 and 1020.
[[ratelimits]]
name = "SIGN_IN_LIMIT"
namespace_id = "1003"

  [ratelimits.simple]
  limit = 10
  period = 60

# Messages each device may send on channel sockets: 60 every 10 seconds.
[[ratelimits]]
name = "SEND_LIMIT"
namespace_id = "1004"

  [ratelimits.simple]
  limit = 60
  period = 10

# Each invite asks GitHub who has the login, which counts against the OAuth
# App's hourly limit that sign-in needs too: 30 a minute per inviting user.
[[ratelimits]]
name = "INVITE_LIMIT"
namespace_id = "1005"

  [ratelimits.simple]
  limit = 30
  period = 60

# Each request for cloud access asks GitHub about the account: 5 a minute per
# user is room for retries and none for a script.
[[ratelimits]]
name = "CLOUD_ACCESS_LIMIT"
namespace_id = "1007"

  [ratelimits.simple]
  limit = 5
  period = 60

# Each beta sign-up asks GitHub about the account, like a cloud access request.
[[ratelimits]]
name = "BETA_LIMIT"
namespace_id = "1011"

  [ratelimits.simple]
  limit = 5
  period = 60

# Notices pushed to one native app's token: a busy computer sends a few a
# minute; 30 leaves room for several computers and none for a flood.
[[ratelimits]]
name = "PUSH_LIMIT"
namespace_id = "1013"

  [ratelimits.simple]
  limit = 30
  period = 60

# Feedback from the app, which needs no sign-in, so per client IP: a person
# sends one now and then; 5 a minute leaves room for that and none for a script.
[[ratelimits]]
name = "FEEDBACK_LIMIT"
namespace_id = "1015"

  [ratelimits.simple]
  limit = 5
  period = 60

# The /linear calls one user makes: some ask Linear, so 30 a minute.
[[ratelimits]]
name = "LINEAR_LIMIT"
namespace_id = "1017"

  [ratelimits.simple]
  limit = 30
  period = 60

# One SQLite-backed object per channel: its messages, their seq and the live
# sockets.
[[durable_objects.bindings]]
name = "CHANNEL"
class_name = "Channel"

# One SQLite-backed object per computer, named by its label: the relay.
[[durable_objects.bindings]]
name = "RELAY"
class_name = "Relay"

# One SQLite-backed object per cloud machine, named by its label: the
# container that runs `arakun-server` for an account with the `cloud` flag
# (src/cloud_machine.ts). Only this test Worker has it so far; production gets
# it, with its container, once it has been tried here (cloud/README.md, "Cloud
# machines").
[[durable_objects.bindings]]
name = "CLOUD_MACHINE"
class_name = "CloudMachine"

# The container behind CloudMachine. Under the `durable_object` policy the
# object picks the image and the size at each start, and can snapshot the disk.
# The build context is the repository, so the image can take the release
# installer from tools/; machine/Dockerfile.dockerignore keeps the rest out.
[[containers]]
name = "arakun-cloud-dev-machine"
class_name = "CloudMachine"
scheduling_policy = "durable_object"

  [containers.images.server]
  dockerfile = "./machine/Dockerfile"
  build_context = ".."

# The relay's history comes first: a Worker deployed from the old relay/ is at
# `v1` with `Relay`, so deploying this one over it only adds `Channel`. Never
# reorder or rename a tag; add a new one, here and under [env.production].
# `v3` is here only until production gets cloud machines; it then goes there
# too, with the same tag.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Relay"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Channel"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["CloudMachine"]

# The hosted Worker (`npx wrangler deploy --env production`), which
# .github/workflows/cloud-deploy.yml deploys with each release. ADMIN_SECRET,
# GITHUB_CLIENT_SECRET, CLOUD_REQUESTS_WEBHOOK, BETA_REQUESTS_WEBHOOK,
# APNS_KEY, APNS_KEY_ID, FCM_SERVICE_ACCOUNT and LINEAR_API_KEY stay Worker
# secrets. An
# environment inherits no bindings, so they are all here again. The one route covers the account host
# app.arakun.dev and the old label hosts, which tell old apps to update.
[env.production]
name = "arakun-cloud"
workers_dev = false
routes = [{ pattern = "*.arakun.dev/*", zone_name = "arakun.dev" }]

[[env.production.d1_databases]]
binding = "DB"
database_name = "prod-arakun-cloud"
database_id = "c80d2c02-b6e0-4b08-a431-906f654075eb"
migrations_dir = "migrations"

[[env.production.ratelimits]]
name = "SIGN_IN_LIMIT"
namespace_id = "1001"

  [env.production.ratelimits.simple]
  limit = 10
  period = 60

[[env.production.ratelimits]]
name = "SEND_LIMIT"
namespace_id = "1002"

  [env.production.ratelimits.simple]
  limit = 60
  period = 10

[[env.production.ratelimits]]
name = "INVITE_LIMIT"
namespace_id = "1006"

  [env.production.ratelimits.simple]
  limit = 30
  period = 60

[[env.production.ratelimits]]
name = "CLOUD_ACCESS_LIMIT"
namespace_id = "1008"

  [env.production.ratelimits.simple]
  limit = 5
  period = 60

[[env.production.ratelimits]]
name = "BETA_LIMIT"
namespace_id = "1012"

  [env.production.ratelimits.simple]
  limit = 5
  period = 60

[[env.production.ratelimits]]
name = "PUSH_LIMIT"
namespace_id = "1014"

  [env.production.ratelimits.simple]
  limit = 30
  period = 60

[[env.production.ratelimits]]
name = "FEEDBACK_LIMIT"
namespace_id = "1016"

  [env.production.ratelimits.simple]
  limit = 5
  period = 60

# The /linear calls one user makes: some ask Linear, so 30 a minute.
[[env.production.ratelimits]]
name = "LINEAR_LIMIT"
namespace_id = "1018"

  [env.production.ratelimits.simple]
  limit = 30
  period = 60

[[env.production.durable_objects.bindings]]
name = "CHANNEL"
class_name = "Channel"

[[env.production.durable_objects.bindings]]
name = "RELAY"
class_name = "Relay"

# The same tags in the same order as the top-level list, up to `v2`: `v3`
# (CloudMachine) comes here when production gets cloud machines.
[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["Relay"]

[[env.production.migrations]]
tag = "v2"
new_sqlite_classes = ["Channel"]

[[env.production.kv_namespaces]]
binding = "CONFIG"
id = "c6b6881faa8941e7aac00b98dbe0b45d"

[env.production.assets]
directory = "../phone/dist"
binding = "ASSETS"
run_worker_first = true

[env.production.vars]
GITHUB_CLIENT_ID = "Ov23lipgmMeATCa5aTr3"
BASE_DOMAIN = "arakun.dev"
# The route takes every host under arakun.dev; only this one is the account's.
ACCOUNT_HOST = "app.arakun.dev"
APNS_TEAM_ID = "V9JGU28UV7"
APNS_TOPIC = "com.arakun.ios"
# The Arakun team in Linear, where feedback becomes customer requests
# (src/feedback.ts). The key is `wrangler secret put LINEAR_API_KEY`.
LINEAR_TEAM_ID = "8b4b9034-fa97-447d-b9db-04ee52b0f360"
