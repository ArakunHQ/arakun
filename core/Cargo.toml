# `arakun-core`: the code the app shares with `arakun-server` and the examples:
# agents, the phone, the server, the terminal, the browser, and the platform, theme
# and UI kit they draw with. The app (src/), `arakun-server` (server/) and the
# examples are thin binaries over it. What they answer differently, this crate asks
# through `host`.
[package]
name = "arakun-core"
# The app's version: `ARAKUN_VERSION` falls back to it (build.rs).
version = "0.14.1"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
# the phone's page (phone/) and the app's assets (assets/), embedded in the binary
rust-embed = "8"
anyhow.workspace = true
image.workspace = true
imagesize = "0.15"
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true
ignore.workspace = true
unicode-segmentation.workspace = true
# terminal
alacritty_terminal = { version = "0.26", default-features = false }
# the server's terminals wait on their PTYs as alacritty does (src/server/pty.rs)
polling = "3"
futures.workspace = true
# canonical paths without Windows' `\\?\` prefix (a no-op elsewhere)
dunce = "1"
# agent transcripts (src/agent)
pulldown-cmark.workspace = true
# image attachments sent to ACP agents (src/agent/attach.rs)
base64.workspace = true
# droid's login at ~/.factory is AES-256-GCM (src/account.rs)
aes-gcm = "0.11"
# file and diff tab colors (src/highlight.rs); fancy-regex keeps it pure Rust
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
# round line joins for the mascot's eyes (src/mascot.rs); gpui only re-exports StrokeOptions
lyon_tessellation = "1.0"
# the island's window handle (src/island.rs)
raw-window-handle.workspace = true
# the phone's remote control (src/phone): WebSocket over plain TCP on the LAN,
# the QR code the Phone tab shows to open it, and the key in that link (0.3 is
# the version other dependencies already pull in)
# rustls with the webpki roots: the phone relay is reached over wss://
tungstenite.workspace = true
qrcode.workspace = true
getrandom.workspace = true
sha2.workspace = true
# Web Push to the phones (src/phone/push.rs): VAPID signing, ECDH and
# aes128gcm with the ring rustls already pulls in
ring.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos", windows))'.dependencies]
# browser tabs (src/browser): CEF, loaded on the first tab. Linux: dlopened from
# ~/.local/share/arakun/cef, and the build needs CEF_PATH (.cargo/config.toml points it at
# .cef-sdk) -> run tools/install-cef.sh once. Windows: the app's build.rs downloads CEF
# into .cef-sdk and copies its runtime next to arakun.exe; libcef.dll is delay-loaded.
cef = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
uds_windows.workspace = true
windows-sys.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
# An https server on 127.0.0.1 that a server clone signs in to (src/server/daemon.rs).
# The rustls ureq already builds.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[features]
# The app's features, which turn on the parts of this crate they name. See the
# app's Cargo.toml.
browser = ["dep:cef"]
coderlabs = []
