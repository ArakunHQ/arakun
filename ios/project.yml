# Generate the Xcode project with `xcodegen` (brew install xcodegen); the
# .xcodeproj itself is not checked in.
name: Arakun
options:
  bundleIdPrefix: com.arakun
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  ArakunKit:
    path: ArakunKit
  # Crash reports, once the user agrees (Arakun/Telemetry.swift). Pinned: a
  # new version is a reviewed change.
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    exactVersion: 4.0.2
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.20.0"
    CURRENT_PROJECT_VERSION: "3"
    DEVELOPMENT_TEAM: V9JGU28UV7
targets:
  Arakun:
    type: application
    platform: iOS
    sources:
      - Arakun
      # Read from assets/ rather than copied, so the app and the desktop never
      # drift apart: the mascot's drawing and the brand's fonts.
      - path: ../assets/brand/mascot.json
        buildPhase: resources
      - path: ../assets/fonts
        buildPhase: resources
        type: folder
    dependencies:
      - package: ArakunKit
      - package: PostHog
      # Embedded in the app: it decrypts each notice before iOS shows it.
      - target: Notifications
    info:
      path: Arakun/Info.plist
      properties:
        CFBundleDisplayName: Arakun
        # XcodeGen writes "1.0" and "1" here otherwise, which ignores the
        # versions ios-release.yml sets, so App Store Connect rejects every
        # upload after the first as a build it already has.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # App Store Connect rejects an iPad app with multitasking unless it
        # lists all four (error 90474). The iPhone keeps no upside-down.
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIAppFonts: [fonts/Geist-Regular.ttf, fonts/Geist-Medium.ttf, fonts/Geist-SemiBold.ttf, fonts/GeistMono-Regular.ttf, fonts/GeistMono-Medium.ttf]
        # Photos come through the system's photo picker, which runs outside the
        # app, so there is no photo library string: only the camera asks.
        NSCameraUsageDescription: Arakun scans the pairing code your computer shows, and takes the photos you send to an agent.
        CFBundleURLTypes:
          - CFBundleURLName: com.arakun.pair
            CFBundleURLSchemes: [arakun]
        # Answers App Store Connect's export compliance question for every
        # build, so a new upload doesn't wait on someone to answer it by hand.
        # The only encryption is HTTPS, the end-to-end encryption in
        # ArakunKit's E2E.swift and the decryption of push notices in its
        # WebPush.swift (RFC 8291), all from Apple's own CryptoKit and
        # URLSession, which Apple counts as exempt. Revisit this if the app
        # ships its own cryptography.
        ITSAppUsesNonExemptEncryption: false
        # The Keychain group the push keys live in, which the notification
        # service extension reads too. The build fills in the team.
        ArakunKeychainGroup: $(AppIdentifierPrefix)com.arakun.ios.shared
    entitlements:
      path: Arakun/Arakun.entitlements
      properties:
        # Xcode signs every build with a development profile, which only
        # takes `development`; exporting for the App Store re-signs it as
        # `production`. So a Debug build gets its token from APNs's sandbox
        # and a TestFlight or App Store build from production, as
        # PushSetup.sandbox (#if DEBUG) assumes.
        aps-environment: development
        # The app's own group first: new Keychain items without a group go
        # in the first one, and only the push keys are for the extension.
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.arakun.ios
          - $(AppIdentifierPrefix)com.arakun.ios.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arakun.ios
        # Said outright, so xcodebuild knows the scheme's platforms before it
        # resolves the packages; otherwise it warns they are empty.
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic

  # The notification service extension: it decrypts the notice the Worker
  # passes on in an APNs alert (Notifications/NotificationService.swift).
  Notifications:
    type: app-extension
    platform: iOS
    sources:
      - Notifications
    dependencies:
      - package: ArakunKit
    info:
      path: Notifications/Info.plist
      properties:
        CFBundleDisplayName: Arakun
        # The same versions as the app, or App Store Connect refuses the upload.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ArakunKeychainGroup: $(AppIdentifierPrefix)com.arakun.ios.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: Notifications/Notifications.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.arakun.ios.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arakun.ios.notifications
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
