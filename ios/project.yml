# Generate the Xcode project with `xcodegen` (brew install xcodegen); the
# .xcodeproj itself is not checked in.
name: Arakun
options:
  bundleIdPrefix: com.arakun
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  ArakunKit:
    path: ArakunKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.13.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: V9JGU28UV7
targets:
  Arakun:
    type: application
    platform: iOS
    sources: [Arakun]
    dependencies:
      - package: ArakunKit
    info:
      path: Arakun/Info.plist
      properties:
        CFBundleDisplayName: Arakun
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIAppFonts: [Geist-Regular.ttf, Geist-Medium.ttf, Geist-SemiBold.ttf, GeistMono-Regular.ttf, GeistMono-Medium.ttf]
        NSCameraUsageDescription: Arakun scans the pairing code your computer shows.
        CFBundleURLTypes:
          - CFBundleURLName: com.arakun.pair
            CFBundleURLSchemes: [arakun]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arakun.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
