# Git hooks that run the checks CI runs, but only for the parts you changed.
# Turn them on once with `lefthook install`; see "Git hooks" in CONTRIBUTING.md.
# Skip them for one command with `LEFTHOOK=0 git commit ...`, or one job with
# `LEFTHOOK_EXCLUDE=clippy git commit ...`. Personal changes go in
# lefthook-local.yml, which git ignores.

# In a linked worktree, git gives hooks GIT_DIR (and GIT_INDEX_FILE) pointing at
# your repository. A test that runs `git init` and `git commit` in a temporary
# folder would then commit to your branch, and the push would send those
# commits. So the cargo jobs run without git's variables.

# Quick checks on every commit. They run on the working tree, so changes you
# have not staged count too.
pre-commit:
  parallel: true
  jobs:
    # Includes design_lint. Same flags as CI, without CI's build tweaks.
    # `&rust` is what the Rust build reads, as in the "What changed" job in
    # ci.yml; cargo-test reuses it. The app embeds phone/, so it counts too.
    - name: clippy
      glob: &rust ["*.rs", "src/*", "core/*", "examples/*", "assets/*", "phone/**/*", "Cargo.toml", "Cargo.lock", "clippy.toml", ".cargo/*", "rust-toolchain.toml"]
      run: env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE cargo clippy --locked --all-targets --no-default-features -- -D warnings

    # npx would download an unrelated `tsc` package if node_modules is missing.
    # npm ci again when the lockfile is newer than the install, as after
    # switching to a branch with other dependencies.
    - name: cloud-types
      glob: &cloud ["cloud/*", "cloud/**/*", ".github/workflows/ci.yml", ".github/actions/*", ".github/actions/**/*"]
      run: cd cloud && (test node_modules/.package-lock.json -nt package-lock.json || npm ci) && npm run check

    # The phone's encryption against the vectors the Rust side writes, so a
    # change on either side runs it. No `root:`, which would drop src/phone.
    - name: phone
      glob: ["phone/*", "phone/**/*", "core/src/phone/*"]
      run: cd phone && (test node_modules/.package-lock.json -nt package-lock.json || npm ci) && npm test

# The slower tests, once per push, for the commits you push.
pre-push:
  parallel: true
  jobs:
    - name: cargo-test
      glob: *rust
      run: env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE cargo test --locked --no-default-features

    - name: cloud-tests
      glob: *cloud
      run: cd cloud && (test node_modules/.package-lock.json -nt package-lock.json || npm ci) && npm test

    # The iOS app's protocol, against the vectors the Rust side writes; as
    # the "What changed" job in ci.yml, phone/ and CI itself count too. Swift
    # with CryptoKit is macOS only, so it skips elsewhere.
    - name: ios-tests
      glob: ["ios/*", "ios/**/*", "phone/*", "phone/**/*", ".github/workflows/ci.yml", ".github/actions/*", ".github/actions/**/*"]
      run: if [ "$(uname)" = Darwin ]; then cd ios/ArakunKit && swift test; else echo "ios-tests skipped, macOS only"; fi

    # The Android app's tests (its protocol against the phone's vectors too), lint and build.
    # Needs JDK 17 and the Android SDK, as android/README.md says.
    - name: android
      # The paths ci.yml's changes job sends to the Android job.
      glob: ["android/*", "android/**/*", "phone/*", "phone/**/*", "assets/brand/mascot.json", "assets/fonts/*", ".github/workflows/ci.yml", ".github/actions/*", ".github/actions/**/*"]
      run: cd android && ./gradlew --quiet :kit:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

commit-msg:
  jobs:
    - name: conventional-commits
      run: tools/conventional-commits.sh message {1}
