# Git hooks that run the checks CI runs, but only for the parts you changed.
# Turn them on once with `lefthook install`; see "Git hooks" in CONTRIBUTING.md.
# Skip them for one command with `LEFTHOOK=0 git commit ...`, or one job with
# `LEFTHOOK_EXCLUDE=clippy git commit ...`. Personal changes go in
# lefthook-local.yml, which git ignores.

# Quick checks on every commit. They run on the working tree, so changes you
# have not staged count too.
pre-commit:
  parallel: true
  jobs:
    # Includes design_lint. Same flags as CI, without CI's build tweaks.
    # `&rust` is what the Rust build reads, as in the "What changed" job in
    # ci.yml; cargo-test reuses it. The app embeds phone/, so it counts too.
    - name: clippy
      glob: &rust ["*.rs", "src/*", "examples/*", "assets/*", "phone/*", "Cargo.toml", "Cargo.lock", "clippy.toml", ".cargo/*"]
      run: cargo clippy --locked --all-targets --no-default-features -- -D warnings

    # npx would download an unrelated `tsc` package if node_modules is missing.
    - name: relay-types
      root: relay/
      glob: "*"
      run: (test -d node_modules || npm ci) && npx tsc --noEmit

    # The phone's encryption against the vectors the Rust side writes, so a
    # change on either side runs it. No `root:`, which would drop src/phone.
    - name: phone
      glob: ["phone/*", "src/phone/*"]
      run: cd phone && node --test "test/*.test.mjs"

# The slower tests, once per push, for the commits you push.
pre-push:
  parallel: true
  jobs:
    - name: cargo-test
      glob: *rust
      run: cargo test --locked --no-default-features

    - name: relay-tests
      root: relay/
      glob: "*"
      run: (test -d node_modules || npm ci) && npx vitest run

commit-msg:
  jobs:
    - name: conventional-commits
      run: tools/conventional-commits.sh message {1}
