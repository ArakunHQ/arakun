# The relay: one Worker, one Durable Object per computer (its label), the phone
# page served as static assets. In production the Worker answers *.arakun.dev and
# reads the label from the Host; without that zone, deploy it under the label
# itself (`wrangler deploy --name <label>`) and <label>.<account>.workers.dev
# works the same way.
name = "arakun-relay"
main = "src/index.ts"
compatibility_date = "2025-10-01"

[vars]
# Hosts under this domain carry the label as their first level.
BASE_DOMAIN = "arakun.dev"

# The phone page, straight from the repo: the Worker runs first and hands the
# rest to the assets.
[assets]
directory = "../phone"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "RELAY"
class_name = "Relay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Relay"]

# Global switches and per-plan limits; `wrangler kv namespace create CONFIG`
# gives the id to put here.
[[kv_namespaces]]
binding = "CONFIG"
id = "00000000000000000000000000000000"

# The hosted relay at *.arakun.dev, which .github/workflows/relay-deploy.yml
# deploys with each release (`npx wrangler deploy --env production`). None of this is
# secret: the ADMIN_SECRET stays a Worker secret. An environment inherits no
# vars or bindings, so they are all here again.
[env.production]
name = "arakun-relay"
workers_dev = false
routes = [{ pattern = "*.arakun.dev/*", zone_name = "arakun.dev" }]

[env.production.vars]
BASE_DOMAIN = "arakun.dev"

[[env.production.durable_objects.bindings]]
name = "RELAY"
class_name = "Relay"

[[env.production.kv_namespaces]]
binding = "CONFIG"
id = "c6b6881faa8941e7aac00b98dbe0b45d"
