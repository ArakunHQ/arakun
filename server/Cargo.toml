# `arakun-server`: the server part of Arakun (core/src/server.rs) as a program
# of its own, for a machine with no display. It is a thin binary over the code it
# shares with the app (core/), but built against GPUI without Wayland and X11, so
# the binary needs none of the desktop libraries the app links.
#
#   cargo build --release --locked -p arakun-server
#
# Build it on its own, as above: built together with the app, Cargo gives both
# the same GPUI, with the display code in it.
[package]
name = "arakun-server"
# The app's version: the two are released together.
version = "0.18.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

[[bin]]
name = "arakun-server"
path = "src/main.rs"
# Its code is in core/, and its tests run with that crate's.
test = false

[dependencies]
arakun-core = { path = "../core" }
# GPUI's headless platform: no `wayland`, no `x11`, no `font-kit`.
gpui_platform.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# As in the app: without it the build needs the full Xcode to compile Metal shaders.
gpui_platform = { workspace = true, features = ["runtime_shaders"] }
