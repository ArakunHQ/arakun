# Arakun teams: sign-in with GitHub and per-user feature flags, in one Worker
# with a D1 database. Teams, members and chat come later, on the same database.
# The top-level Worker is for tests; production is `--env production` below.
# Their names differ so a test deploy cannot replace production's bindings.
name = "arakun-teams-dev"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# Users, sessions and flags. `wrangler d1 create arakun-teams` gives the id to
# put here; `wrangler d1 migrations apply` reads the tables from migrations/.
[[d1_databases]]
binding = "DB"
database_name = "arakun-teams"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# The GitHub OAuth App "Arakun" (ArakunHQ). The desktop app runs the device
# flow with this public ID and no secret; the Worker asks GitHub whether that
# app issued a token with `wrangler secret put GITHUB_CLIENT_SECRET`.
[vars]
GITHUB_CLIENT_ID = "Ov23lipgmMeATCa5aTr3"

# Sign-in calls GitHub and writes to D1, so each client IP gets a few a minute.
# The id must be unique among the account's rate limits; relay/ has none.
[[ratelimits]]
name = "SIGN_IN_LIMIT"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60

# The hosted Worker (`npx wrangler deploy --env production`). ADMIN_SECRET and
# GITHUB_CLIENT_SECRET stay Worker secrets. An environment inherits no bindings, so they are all
# here again. No route yet: the hostname is picked when it is first deployed.
[env.production]
name = "arakun-teams"

[[env.production.d1_databases]]
binding = "DB"
database_name = "arakun-teams"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[env.production.ratelimits]]
name = "SIGN_IN_LIMIT"
namespace_id = "1001"

  [env.production.ratelimits.simple]
  limit = 10
  period = 60

[env.production.vars]
GITHUB_CLIENT_ID = "Ov23lipgmMeATCa5aTr3"
